<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#e94560">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>IRON LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f1a;--card:#1a1a2e;--card2:#16213e;--input:#1e2a45;
  --accent:#e94560;--accent2:#ff6b6b;--gold:#ffd700;
  --text:#f0f0f0;--muted:#a0a0b0;--dim:#6c6c7c;
  --border:#2a2a4a;--green:#2ecc71;--blue:#3498db;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;overflow:hidden}
#root{height:100%;display:flex;flex-direction:column}
.app{display:flex;flex-direction:column;height:100%}
.page{flex:1;overflow-y:auto;padding:16px 16px 24px;-webkit-overflow-scrolling:touch}
.page::-webkit-scrollbar{display:none}

/* Bottom Nav */
.nav{display:flex;background:var(--card);border-top:1px solid var(--border);padding:6px 0 env(safe-area-inset-bottom,8px);flex-shrink:0}
.nav-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;background:none;border:none;color:var(--dim);font-size:10px;font-family:inherit;cursor:pointer;transition:color .2s}
.nav-btn.active{color:var(--accent)}
.nav-btn .icon{font-size:20px}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.card-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:600}

/* Inputs */
.input-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;min-width:0}
.input-sm{width:64px;padding:8px 6px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;text-align:center;font-family:inherit}
.input-sm:focus{outline:none;border-color:var(--accent)}
.input-md{flex:1;min-width:0;width:100%;padding:8px 10px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:inherit}
.input-md:focus{outline:none;border-color:var(--accent)}

/* Buttons */
.btn{padding:10px 20px;border:none;border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:active{background:#c13a52}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-outline:active{background:var(--card2)}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:6px}
.btn-block{width:100%;display:block}

/* Exercise Card */
.ex-card{background:var(--card2);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.ex-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer}
.ex-name{font-weight:700;font-size:14px}
.ex-target{font-size:11px;color:var(--muted)}
.ex-e1rm{font-size:12px;color:var(--gold);font-weight:700}
.ex-body{padding:0 14px 12px}
.cat-label{font-size:11px;color:var(--accent2);font-weight:700;letter-spacing:1px;padding:8px 14px 4px;text-transform:uppercase}

/* Set Row */
.set-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:12px}
.set-num{width:24px;text-align:center;color:var(--dim);font-weight:600;font-size:11px}
.set-e1rm{font-size:11px;color:var(--gold);min-width:42px;text-align:right}
.prev-history{background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin:0 0 10px 30px}
.prev-history-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;color:var(--muted)}
.prev-history-title{color:var(--accent2);font-weight:700;letter-spacing:.3px}
.prev-history-sets{display:flex;gap:4px;flex-wrap:wrap}
.prev-chip{background:var(--input);border:1px solid var(--border);border-radius:999px;padding:3px 8px;font-size:11px;color:var(--text);font-weight:600}
.prev-best{font-size:11px;color:var(--gold);font-weight:700;margin-top:6px}
.prev-empty{font-size:11px;color:var(--dim);margin:0 0 8px 30px}
.target-guide{background:rgba(233,69,96,.08);border:1px solid rgba(233,69,96,.35);border-radius:8px;padding:8px 10px;margin:0 0 10px 30px}
.target-guide-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:11px;color:var(--muted)}
.target-guide-title{color:var(--gold);font-weight:700;letter-spacing:.3px}
.target-guide-chips{display:flex;gap:4px;flex-wrap:wrap}
.target-chip{background:var(--input);border:1px solid rgba(233,69,96,.35);border-radius:999px;padding:3px 8px;font-size:11px;color:var(--text);font-weight:700}
.set-suggestion{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-left:30px;margin-bottom:6px}
.set-suggestion.up{color:var(--gold);font-weight:700}
.apply-chip{border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:999px;padding:2px 7px;font-size:10px;font-family:inherit;cursor:pointer}
.effort-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-left:30px;margin-top:-2px;margin-bottom:6px;font-size:10px;color:var(--dim)}
.effort-label{color:var(--muted);font-weight:700;margin-right:2px}
.effort-chip{border:1px solid var(--border);background:var(--input);color:var(--muted);border-radius:999px;padding:3px 8px;font-size:10px;font-family:inherit;cursor:pointer;line-height:1}
.effort-chip.active{border-color:var(--gold);color:var(--gold);font-weight:800;background:rgba(255,215,0,.08)}
.effort-chip.danger.active{border-color:#e74c3c;color:#e74c3c;background:rgba(231,76,60,.08)}
.effort-help{font-size:10px;color:var(--dim);margin-left:30px;margin-bottom:6px;line-height:1.35}

.effort-select{width:76px;padding:8px 4px;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:11px;text-align:center;font-family:inherit;appearance:auto}
.effort-select:focus{outline:none;border-color:var(--accent)}
.effort-select option{background:var(--card);color:var(--text)}


/* Max challenge score */
.challenge-mini{background:linear-gradient(135deg,rgba(233,69,96,.12),rgba(255,215,0,.06));border:1px solid rgba(233,69,96,.35);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.challenge-mini-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.challenge-mini-title{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.4px}
.challenge-score{font-size:28px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.challenge-mini-status{font-size:12px;color:var(--text);font-weight:700;margin-bottom:2px}
.challenge-mini-note{font-size:11px;color:var(--dim);line-height:1.45}
.challenge-score-card{text-align:center;padding:18px 10px 14px;border-bottom:1px solid var(--border);margin-bottom:12px}
.challenge-score-large{font-size:56px;font-weight:900;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.challenge-status{font-size:15px;font-weight:800;margin-top:8px;color:var(--text)}
.challenge-recommend{font-size:12px;color:var(--muted);line-height:1.55;margin-top:6px}
.challenge-detail{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);padding:8px 0;font-size:12px}
.challenge-detail:last-child{border-bottom:none}
.challenge-detail-label{color:var(--muted);min-width:100px}
.challenge-detail-value{text-align:right;color:var(--text);font-weight:700}
.challenge-detail-value.good{color:var(--gold)}
.challenge-detail-value.bad{color:#e74c3c}
.challenge-bullets{font-size:12px;line-height:1.65;color:var(--muted);padding-left:16px;margin-top:6px}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-head{font-size:10px;color:var(--dim);padding:4px 0;font-weight:600}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:12px;cursor:pointer;position:relative}
.cal-day.today{border:1px solid var(--accent)}
.cal-day.has-d1{background:var(--accent);color:#fff;font-weight:700}
.cal-day.has-d2{background:var(--blue);color:#fff;font-weight:700}
.cal-day.has-both{background:linear-gradient(135deg,var(--accent) 50%,var(--blue) 50%);color:#fff;font-weight:700}
.cal-day.has-d3{background:var(--green);color:#fff;font-weight:700}
.badge-d3{background:var(--green);color:#fff}
.pk-conds{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.pk-cond{font-size:10px;color:var(--dim);border:1px solid var(--border);border-radius:8px;padding:4px 8px}
.pk-cond.ok{color:var(--green);border-color:var(--green)}
.pk-weekly{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12px;flex-wrap:wrap}
.ex-card.ex-sub{border-color:var(--gold)}
.sub-chip{display:inline-block;margin-left:6px;font-size:10px;color:var(--gold);border:1px solid var(--gold);border-radius:8px;padding:1px 6px;vertical-align:middle}
.sub-box{background:var(--card2);border:1px dashed var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.sub-head{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.sub-opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sub-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--input);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-family:inherit;text-align:left;cursor:pointer}
.sub-opt.on{border-color:var(--gold)}
.sub-idx{font-size:10px;color:var(--gold);font-weight:700}
.sub-name{font-size:12px;font-weight:700}
.sub-meta{font-size:10px;color:var(--dim)}
.sub-info{display:flex;flex-direction:column;gap:3px;margin-top:6px;font-size:10px;color:var(--muted)}
.sub-promote{color:var(--gold);font-weight:700}
.pk-judge{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border);font-size:11px}
.wu-card{background:var(--card);border:1px solid var(--gold);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.wu-card.done{border-color:var(--green);opacity:.85}
.wu-head{display:flex;align-items:center;gap:10px}
.wu-check{width:26px;height:26px;border-radius:7px;border:2px solid var(--gold);background:var(--input);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0;color:var(--green)}
.wu-card.done .wu-check{border-color:var(--green);background:rgba(76,175,80,.15)}
.wu-title{font-size:13px;font-weight:700}
.wu-sub{font-size:10px;color:var(--dim);margin-top:2px}
.wu-detail{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.wu-step{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px}
.wu-step svg{width:100%;height:auto;background:var(--card2);border-radius:8px}
.wu-step h4{font-size:12px;margin:0 0 4px;color:var(--gold)}
.wu-step ol{margin:0;padding-left:18px;font-size:11px;line-height:1.6;color:var(--muted)}
.wu-step .cue{font-size:10px;color:var(--dim);margin-top:4px;line-height:1.5}
.pk-judge b{color:var(--text)}
.cal-day.empty{opacity:0;pointer-events:none}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-month{font-size:16px;font-weight:700}

/* Charts */
.chart-container{position:relative;width:100%;height:200px;margin:8px 0}
.chart-container canvas{width:100%!important;height:100%!important}

/* Formula table */
.formula-table{width:100%;border-collapse:collapse;font-size:12px}
.formula-table th{text-align:left;padding:6px 8px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)}
.formula-table td{padding:6px 8px;border-bottom:1px solid var(--border)}
.formula-table .recommended{color:var(--gold);font-weight:700}

/* Timer overlay */
.timer-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
.timer-display{font-size:72px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums}
.timer-label{font-size:14px;color:var(--muted);margin-bottom:16px}

/* PR banner */
.pr-banner{position:fixed;top:20px;left:16px;right:16px;background:linear-gradient(135deg,var(--gold),#ff8c00);color:#000;padding:14px 18px;border-radius:12px;font-weight:700;text-align:center;z-index:90;animation:slideDown .4s ease}
@keyframes slideDown{from{transform:translateY(-100px);opacity:0}to{transform:translateY(0);opacity:1}}

/* Percentage table */
.pct-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px}
.pct-cell{background:var(--input);padding:6px;border-radius:6px;text-align:center}
.pct-cell .pct{color:var(--muted);font-size:10px}
.pct-cell .kg{font-weight:700;color:var(--text)}

/* Tabs */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px;min-width:0}
.e1rm-tabs{grid-template-columns:repeat(5,minmax(0,1fr))}
.volume-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.volume-stat{background:var(--input);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.volume-stat .value{font-size:20px;font-weight:900;color:var(--gold)}
.volume-stat .label{font-size:10px;color:var(--muted);margin-top:2px}
.tab{min-width:0;padding:8px 6px;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Misc */
.pk-panel{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:12px}
.pk-panel.pk-key{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,215,0,.25)}
.pk-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pk-label{font-size:14px;font-weight:800}
.pk-meta{font-size:10px;color:var(--dim)}
.pk-phase{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;background:var(--accent);color:#fff}
.pk-phase.gold{background:var(--gold);color:#1a1a2e}
.pk-rows{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.pk-row{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.25);border-radius:8px;padding:8px 10px}
.pk-tag{font-size:10px;color:var(--accent2);font-weight:700;min-width:64px}
.pk-num{font-size:15px;font-weight:800;letter-spacing:.3px}
.pk-cap{margin-left:auto;font-size:10px;color:var(--gold);font-weight:700}
.pk-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:6px}
.pk-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pk-modechip{font-size:10px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:10px;padding:4px 8px;align-self:center}
.pk-sel{background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 8px;font-size:11px;font-family:inherit}
.pk-plan-item{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.pk-plan-item.done{opacity:.5}
.pk-plan-item.now{border-color:var(--accent)}
.pk-plan-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.pk-plan-name{font-size:13px;font-weight:700}
.pk-plan-main{font-size:11px;color:var(--muted);line-height:1.5}
.pk-count{font-size:26px;font-weight:900;color:var(--accent)}
.page-title{font-size:20px;font-weight:900;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.badge-d1{background:var(--accent);color:#fff}
.badge-d2{background:var(--blue);color:#fff}
.divider{height:1px;background:var(--border);margin:12px 0}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0}
.stat-label{color:var(--muted);font-size:12px}
.stat-value{font-weight:700;font-size:16px}
.stat-value.gold{color:var(--gold)}
select{appearance:none;background:var(--input);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 12px;font-family:inherit;font-size:13px}
select:focus{outline:none;border-color:var(--accent)}
.shoulder-bar{display:flex;gap:4px;margin-top:8px}
.shoulder-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;border:2px solid transparent;transition:all .2s}
.shoulder-dot.active{border-color:var(--gold);transform:scale(1.15)}
.empty-state{text-align:center;padding:40px 20px;color:var(--dim)}
.empty-state .icon{font-size:48px;margin-bottom:12px}

/* VBT Video RPE */
.vbt-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:110;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
.vbt-panel{max-width:480px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.vbt-canvas{width:100%;border-radius:10px;background:#000;margin-top:8px;touch-action:manipulation}
.vbt-hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}
.vbt-hint b{color:var(--gold)}
.vbt-result-main{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.vbt-rep-row{display:flex;justify-content:space-between;font-size:11px;padding:5px 2px;border-bottom:1px solid var(--border)}
.btn-vbt{background:none;border:1px solid var(--border);border-radius:6px;font-size:13px;padding:2px 5px;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ==================== DATABASE ====================
const DB_NAME = 'ironlog';
const DB_VER = 1;
let dbInstance = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (dbInstance) return resolve(dbInstance);
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('workouts')) {
        const ws = db.createObjectStore('workouts', { keyPath: 'id' });
        ws.createIndex('date', 'date');
      }
      if (!db.objectStoreNames.contains('bodyweight')) {
        const bw = db.createObjectStore('bodyweight', { keyPath: 'date' });
      }
      if (!db.objectStoreNames.contains('settings')) {
        db.createObjectStore('settings', { keyPath: 'key' });
      }
    };
    req.onsuccess = e => { dbInstance = e.target.result; resolve(dbInstance); };
    req.onerror = e => reject(e);
  });
}

async function dbPut(store, data) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(data);
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e);
  });
}

async function dbGet(store, key) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => res(req.result);
    req.onerror = e => rej(e);
  });
}

async function dbGetAll(store) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror = e => rej(e);
  });
}

async function dbDelete(store, key) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => res();
    tx.onerror = e => rej(e);
  });
}

// ==================== FORMULAS ====================
const FORMULAS = {
  epley:    { name: 'Epley',    fn: (w,r) => r===1?w: w*(1+r/30),         desc: '汎用・上級者推奨' },
  brzycki:  { name: 'Brzycki',  fn: (w,r) => r===1?w: w*(36/(37-r)),      desc: '低レップで精度◎' },
  lombardi: { name: 'Lombardi', fn: (w,r) => r===1?w: w*Math.pow(r,0.10), desc: '高レップ控えめ' },
  mayhew:   { name: 'Mayhew',   fn: (w,r) => r===1?w: (100*w)/(52.2+41.9*Math.exp(-0.055*r)), desc: 'ベンチ研究ベース' },
  wathan:   { name: 'Wathan',   fn: (w,r) => r===1?w: (100*w)/(48.8+53.8*Math.exp(-0.075*r)), desc: 'Mayhew類似' },
  oconner:  { name: "O'Conner", fn: (w,r) => r===1?w: w*(1+0.025*r),      desc: '保守的・安全寄り' },
};

function calcAllE1RM(w, r) {
  if (!w || !r || r < 1) return null;
  const results = {};
  for (const [k, v] of Object.entries(FORMULAS)) {
    results[k] = Math.round(v.fn(w, r) * 10) / 10;
  }
  const vals = Object.values(results).sort((a, b) => a - b);
  const mid = Math.floor(vals.length / 2);
  results.median = vals.length % 2 ? vals[mid] : (vals[mid - 1] + vals[mid]) / 2;
  results.median = Math.round(results.median * 10) / 10;
  return results;
}

// 自重ベース種目（懸垂等）で使う最新体重。App起動時に更新される。
let LATEST_BW = 0;
function setLatestBw(v) { LATEST_BW = Number(v) || 0; }

// 加重懸垂などの「自重＋加重」種目の総負荷
function totalLoad(s, ex) {
  const added = Number(s?.weight) || 0;
  if (ex?.isLoadedBw) return (LATEST_BW || 0) + added;
  return added;
}

function calcE1RM(w, r, formula = 'epley') {
  if (!w || !r || r < 1) return 0;
  return Math.round(FORMULAS[formula].fn(w, r) * 10) / 10;
}

function filledSets(sets = []) {
  return sets.filter(s => s && s.weight && s.reps && Number(s.weight) > 0 && Number(s.reps) > 0);
}

function isExerciseSetFilled(s, ex) {
  if (!s || !s.reps || Number(s.reps) <= 0) return false;
  if (ex?.isBodyweight) return true;
  // 加重懸垂などは 0kg（＝自重）も有効な記録として扱う
  if (ex?.isLoadedBw) return s.weight === 0 || s.weight === '0' || (!!s.weight && Number(s.weight) >= 0) || s.weight === '';
  return !!s.weight && Number(s.weight) > 0;
}

function exerciseFilledSets(sets = [], ex) {
  return sets.filter(s => isExerciseSetFilled(s, ex));
}

function fmtSet(s, ex) {
  if (!s) return '';
  const rpe = s.rpe ? ` @${s.rpe}` : '';
  if (ex?.isBodyweight) return `${s.reps}rep${rpe}`;
  if (ex?.isLoadedBw) {
    const added = Number(s.weight) || 0;
    return added > 0 ? `+${fmtKg(added)}kg×${s.reps}${rpe}` : `自重×${s.reps}${rpe}`;
  }
  return `${s.weight}kg×${s.reps}${rpe}`;
}

function bestSetByE1RM(sets = [], formula = 'epley', ex = null) {
  let best = null;
  const pool = ex?.isLoadedBw ? exerciseFilledSets(sets, ex) : filledSets(sets);
  pool.forEach(s => {
    const load = ex?.isLoadedBw ? totalLoad(s, ex) : parseFloat(s.weight);
    const e1rm = calcE1RM(load, parseInt(s.reps), formula);
    if (!best || e1rm > best.e1rm) best = { ...s, e1rm };
  });
  return best;
}

function bestSetForExercise(sets = [], ex, formula = 'epley') {
  if (ex?.isBodyweight) {
    return exerciseFilledSets(sets, ex).reduce((best, s) => {
      const reps = Number(s.reps) || 0;
      return !best || reps > Number(best.reps) ? { ...s, reps } : best;
    }, null);
  }
  return bestSetByE1RM(sets, formula, ex);
}

// 「8〜10rep x 4セット」→「8〜10rep」を取り出す
function extractRepText(target = '') {
  const m = String(target).match(/(\d+(?:\s*[〜~\-–]\s*\d+)?)\s*rep/i);
  return m ? `${m[1].replace(/\s+/g, '')}rep` : '';
}

function normalizeExerciseName(name = '') {
  return String(name).replace(/[\s　]/g, '').replace(/[()（）]/g, '').toLowerCase();
}


function roundToPlate(value, increment = 2.5) {
  if (!value || value <= 0) return 0;
  return Math.round(value / increment) * increment;
}

function fmtKg(value) {
  const n = Math.round(Number(value) * 10) / 10;
  return Number.isInteger(n) ? String(n) : String(n);
}

function extractTargetPercentages(target = '') {
  const text = String(target);
  const pcts = new Set();
  let m;
  const rangeRe = /(\d+(?:\.\d+)?)\s*[〜~\-–]\s*(\d+(?:\.\d+)?)\s*%/g;
  while ((m = rangeRe.exec(text)) !== null) {
    pcts.add(Number(m[1]));
    pcts.add(Number(m[2]));
  }
  const singleRe = /(\d+(?:\.\d+)?)\s*%/g;
  while ((m = singleRe.exec(text)) !== null) pcts.add(Number(m[1]));
  return Array.from(pcts).filter(n => n > 0 && n <= 120).sort((a, b) => b - a);
}

function getMaxBasedTargets(ex, settings) {
  if (!ex?.isBench) return [];
  const max = Number(settings?.actualMax?.bench || 0);
  if (!max) return [];
  let pcts = extractTargetPercentages(ex.target);
  if (pcts.length === 0) pcts = [90, 85, 80, 75, 70];
  return pcts.map(pct => ({ pct, kg: roundToPlate(max * pct / 100) }));
}

function parseTargetRepRange(target = '') {
  const text = String(target).replace(/×/g, 'x');
  let m = text.match(/(\d+)\s*[〜~\-–]\s*(\d+)\s*rep/i);
  if (m) {
    const min = Number(m[1]), max = Number(m[2]);
    return { min, max, label: `${min}〜${max}rep` };
  }
  m = text.match(/(\d+)\s*rep/i);
  if (m) {
    const reps = Number(m[1]);
    return { min: reps, max: reps, label: `${reps}rep` };
  }
  m = text.match(/x\s*(\d+)\s*x\s*\d+/i);
  if (m) {
    const reps = Number(m[1]);
    return { min: reps, max: reps, label: `${reps}rep` };
  }
  return null;
}

function getSetRecommendation(ex, prevSet, targetRange) {
  const prevReps = Number(prevSet?.reps);
  if (!prevReps) return null;

  if (ex?.isBodyweight) {
    const nextReps = prevReps + 1;
    const reachedTarget = targetRange ? prevReps >= targetRange.max : false;
    return {
      mode: 'reps',
      label: '推奨',
      reps: nextReps,
      achieved: reachedTarget,
      reason: targetRange
        ? (reachedTarget ? `目標${targetRange.label}達成` : `前回${prevReps}repから+1rep`)
        : `前回${prevReps}repから+1rep`
    };
  }

  if (!prevSet?.weight) return null;
  const prevWeight = Number(prevSet.weight);
  if (!prevWeight) return null;

  let achieved = false;
  let reason = '目標rep未設定';

  if (ex?.isBench && prevReps === 1) {
    achieved = true;
    reason = '前回シングル成功';
  } else if (targetRange) {
    achieved = prevReps >= targetRange.max;
    reason = achieved ? `目標${targetRange.label}達成` : `目標${targetRange.label}未達`;
  } else {
    return { mode: 'weight', label: '維持候補', kg: prevWeight, achieved: false, reason };
  }

  return {
    mode: 'weight',
    label: achieved ? '推奨' : '維持候補',
    kg: achieved ? roundToPlate(prevWeight + 2.5) : prevWeight,
    achieved,
    reason
  };
}

// RIR（あと何レップできたか）基準。RPEは 10 − RIR。
const EFFORT_OPTIONS = [
  { key: 'veryeasy', label: '◎ 余裕',   rpe: '6',   hint: 'あと4回以上。軽すぎる' },
  { key: 'easy',     label: '○ 軽い',   rpe: '7',   hint: 'あと3回。まだ余力あり' },
  { key: 'target',   label: '● 適正',   rpe: '8',   hint: 'あと2回。試合形式3本目・バックオフはここで切る' },
  { key: 'hard',     label: '△ 重い',   rpe: '9',   hint: 'あと1回。判定日でも超えない' },
  { key: 'limit',    label: '× 限界',   rpe: '10',  hint: 'あと0回。練習では出さない' },
];

function effortLabelFromRpe(rpe) {
  if (!rpe) return '';
  const n = Number(rpe);
  if (!n) return '';
  if (n >= 9.75) return '× 限界';
  if (n >= 8.75) return '△ 重い';
  if (n >= 7.75) return '● 適正';
  if (n >= 6.75) return '○ 軽い';
  return '◎ 余裕';
}

function parseLocalDate(dateStr) {
  return new Date(`${dateStr}T00:00:00`);
}

function dayDiff(fromDate, toDate) {
  if (!fromDate || !toDate) return null;
  return Math.round((parseLocalDate(toDate) - parseLocalDate(fromDate)) / 86400000);
}

function hasBadTrainingNote(note = '') {
  return /(失敗|潰れ|つぶれ|痛み|痛い|違和感|肩痛|肘痛|手首痛|危ない|フォーム崩|崩れ)/.test(String(note));
}

function getBenchExerciseIds(settings) {
  const benchKey = normalizeExerciseName('ベンチプレス');
  return getAllExerciseDefs(settings)
    .filter(ex => ex.isBench || ex.id === 'bench_heavy' || ex.id === 'bench_mod' || normalizeExerciseName(ex.name) === benchKey)
    .map(ex => ex.id);
}

function getBenchSessions(workouts, settings, formula, asOfDate = getToday(), includeDate = false) {
  const benchIds = new Set(getBenchExerciseIds(settings));
  return (workouts || [])
    .filter(w => includeDate ? w.date <= asOfDate : w.date < asOfDate)
    .map(w => {
      const sets = [];
      benchIds.forEach(exId => {
        filledSets(w.exercises?.[exId] || []).forEach(s => {
          const weight = Number(s.weight), reps = Number(s.reps);
          if (!weight || !reps) return;
          sets.push({
            ...s,
            exId,
            weight,
            reps,
            rpe: s.rpe ? Number(s.rpe) : null,
            e1rm: calcE1RM(weight, reps, formula)
          });
        });
      });
      if (sets.length === 0) return null;
      const best = sets.reduce((a, b) => !a || b.e1rm > a.e1rm ? b : a, null);
      const singles = sets.filter(s => s.reps === 1);
      const bestSingle = singles.reduce((a, b) => !a || b.weight > a.weight ? b : a, null);
      return {
        date: w.date,
        dayType: w.dayType,
        shoulder: Number(w.shoulder) || null,
        notes: w.notes || '',
        sets,
        best,
        bestSingle
      };
    })
    .filter(Boolean)
    .sort((a, b) => a.date.localeCompare(b.date));
}


function isHighOutputBenchSession(session, actualMax) {
  if (!session) return false;
  if (session.dayType === 'DAY1') return true;
  const max = Number(actualMax || 0);
  if (!max) return false;
  // B/C日は通常 70〜85% の量の日なので、本当に重いセットがある場合だけ出力トレンドに含める。
  return (session.sets || []).some(set => Number(set.weight) >= max * 0.85 || (Number(set.reps) === 1 && Number(set.weight) >= max * 0.85));
}

function getChallengeGrade(score) {
  if (score >= 80) return { label: 'MAX更新チャレンジ候補', tone: 'good' };
  if (score >= 65) return { label: '重めシングルまで。ウォームアップ次第', tone: 'mid' };
  if (score >= 50) return { label: '今日は練習日', tone: 'mid' };
  return { label: 'MAX挑戦非推奨', tone: 'bad' };
}

function calcMaxChallengeScore(workouts, settings, formula = 'epley', asOfDate = getToday(), includeDate = false) {
  const actualMax = Number(settings?.actualMax?.bench || 0);
  const sessions = getBenchSessions(workouts, settings, formula, asOfDate, includeDate);
  const details = [];
  const warnings = [];
  const add = (label, got, max, note, good = got >= max * 0.7) => {
    details.push({ label, got, max, note, good });
  };

  if (!actualMax) {
    return {
      score: 0,
      actualMax,
      grade: getChallengeGrade(0),
      recommendation: '設定画面で実測MAXを入れてください。',
      targetWeight: null,
      details: [{ label: '実測MAX', got: 0, max: 100, note: '未設定', good: false }],
      warnings: ['実測MAXがないため、判定できません。'],
      sessions: []
    };
  }

  if (sessions.length === 0) {
    return {
      score: 0,
      actualMax,
      grade: getChallengeGrade(0),
      recommendation: 'ベンチ記録がまだありません。まず通常練習を記録してください。',
      targetWeight: roundToPlate(actualMax + 2.5),
      details: [{ label: 'ベンチ履歴', got: 0, max: 100, note: '記録なし', good: false }],
      warnings: ['判定材料が不足しています。'],
      sessions: []
    };
  }

  const outputSessions = sessions.filter(s => isHighOutputBenchSession(s, actualMax));
  const recentOutput = outputSessions.slice(-3);
  const latestOutput = outputSessions[outputSessions.length - 1] || null;
  const latest = sessions[sessions.length - 1];
  const recentBestE1RM = recentOutput.reduce((m, s) => Math.max(m, s.best?.e1rm || 0), 0);
  const latestBestE1RM = latestOutput?.best?.e1rm || 0;

  let score = 0;

  let e1rmPts = 0;
  if (recentBestE1RM >= actualMax + 2.5) e1rmPts = 35;
  else if (recentBestE1RM >= actualMax) e1rmPts = 25;
  else if (recentBestE1RM >= actualMax - 2.5) e1rmPts = 15;
  else if (recentBestE1RM >= actualMax - 7.5) e1rmPts = 8;
  score += e1rmPts;
  add('直近e1RM', e1rmPts, 35, recentOutput.length > 0
    ? `${fmtKg(recentBestE1RM)}kg / A日・高重量基準 / 実測MAX ${fmtKg(actualMax)}kg`
    : `A日・85%以上のベンチ記録なし / 実測MAX ${fmtKg(actualMax)}kg`, e1rmPts >= 25);

  const heavySingles = sessions
    .filter(s => {
      const d = dayDiff(s.date, asOfDate);
      return d !== null && d >= 0 && d <= 21;
    })
    .flatMap(s => s.sets.filter(set => set.reps === 1 && set.weight >= actualMax * 0.9).map(set => ({ ...set, date: s.date })));
  const bestHeavySingle = heavySingles.sort((a, b) => b.weight - a.weight || (a.rpe || 99) - (b.rpe || 99))[0];
  let singlePts = 0;
  let singleNote = '90%以上シングルなし';
  if (bestHeavySingle) {
    const rpe = bestHeavySingle.rpe;
    singleNote = `${fmtKg(bestHeavySingle.weight)}kg×1${rpe ? ` @${rpe}` : ' / RPE未入力'}`;
    if (rpe && rpe <= 8.5) singlePts = 20;
    else if (rpe && rpe <= 9) singlePts = 12;
    else if (!rpe && bestHeavySingle.weight >= actualMax * 0.95) singlePts = 12;
    else if (!rpe) singlePts = 8;
    else singlePts = 4;
  }
  score += singlePts;
  add('高重量シングル', singlePts, 20, singleNote, singlePts >= 12);

  const shoulder = latest.shoulder;
  let shoulderPts = 0;
  if (shoulder >= 4) shoulderPts = 15;
  else if (shoulder === 3) shoulderPts = 5;
  score += shoulderPts;
  add('肩コンディション', shoulderPts, 15, shoulder ? `${shoulder}/5` : '未入力', shoulderPts >= 15);

  const priorBeforeDate = sessions.filter(s => s.date < asOfDate).slice(-1)[0];
  let restPts = 0;
  let restNote = '前回ベンチ日なし';
  if (priorBeforeDate) {
    const days = dayDiff(priorBeforeDate.date, asOfDate);
    restNote = `${days}日空き（前回 ${priorBeforeDate.date.slice(5)}）`;
    if (days >= 2 && days <= 5) restPts = 10;
    else if (days === 1 || (days >= 6 && days <= 8)) restPts = 5;
    else restPts = 2;
  } else {
    restPts = 3;
  }
  score += restPts;
  add('疲労抜け', restPts, 10, restNote, restPts >= 10);

  const riskySessions = sessions.filter(s => {
    const d = dayDiff(s.date, asOfDate);
    if (d === null || d < 0 || d > 10) return false;
    return hasBadTrainingNote(s.notes) || (s.shoulder && s.shoulder <= 2) || s.sets.some(set => set.rpe && set.rpe >= 10);
  });
  const failurePts = riskySessions.length === 0 ? 10 : 0;
  score += failurePts;
  add('直近リスク', failurePts, 10, riskySessions.length === 0 ? '失敗/痛みメモなし' : `${riskySessions.length}件のリスク記録`, failurePts === 10);

  let trendPts = 0;
  let trendNote = 'A日・高重量記録不足';
  if (recentOutput.length >= 3) {
    const first = recentOutput[0].best?.e1rm || 0;
    const last = recentOutput[recentOutput.length - 1].best?.e1rm || 0;
    const maxRecent = Math.max(...recentOutput.map(s => s.best?.e1rm || 0));
    trendNote = `${fmtKg(first)} → ${fmtKg(last)}kg（A日・高重量 / 直近最高 ${fmtKg(maxRecent)}kg）`;
    if (last >= first - 1) trendPts = 10;
    else if (last >= first - 5) trendPts = 5;
  } else if (recentOutput.length === 2) {
    const first = recentOutput[0].best?.e1rm || 0;
    const last = recentOutput[1].best?.e1rm || 0;
    trendNote = `${fmtKg(first)} → ${fmtKg(last)}kg（A日・高重量）`;
    trendPts = last >= first ? 8 : 4;
  } else if (recentOutput.length === 1) {
    trendPts = 5;
    trendNote = `最新 ${fmtKg(latestBestE1RM)}kg（A日・高重量）`;
  }
  score += trendPts;
  add('直近トレンド', trendPts, 10, trendNote, trendPts >= 8);

  score = Math.max(0, Math.min(100, Math.round(score)));

  const grade = getChallengeGrade(score);
  const targetWeight = roundToPlate(actualMax + 2.5);
  let recommendation = '';
  if (score >= 80) recommendation = `${fmtKg(targetWeight)}kgに挑戦候補。ウォームアップで95%が重ければ中止。`;
  else if (score >= 65) recommendation = `更新狙いではなく、${fmtKg(roundToPlate(actualMax * 0.95))}kg前後の重めシングルで様子見。`;
  else if (score >= 50) recommendation = 'MAXは狙わず、80〜85%でフォームと速度を作る日。';
  else recommendation = 'MAX挑戦は切る。疲労抜き・フォーム修正・痛み管理を優先。';

  if (shoulder && shoulder <= 3) warnings.push('肩コンディションがMAX挑戦向きではありません。');
  if (recentOutput.length === 0) warnings.push('A日または85%以上の高重量ベンチ記録がないため、出力トレンドは判定材料不足です。');
  if (recentBestE1RM < actualMax) warnings.push('A日・高重量基準の直近e1RMが実測MAXを下回っています。');
  if (riskySessions.length > 0) warnings.push('直近10日以内に失敗・痛み・RPE10相当の記録があります。');

  return {
    score,
    actualMax,
    grade,
    recommendation,
    targetWeight,
    details,
    warnings,
    latest,
    recentBestE1RM,
    sessions,
    outputSessions
  };
}


function calcExerciseVolume(sets = [], ex) {
  const valid = exerciseFilledSets(sets, ex);
  if (ex?.isBodyweight) {
    return { tonnage: 0, reps: valid.reduce((sum, s) => sum + (Number(s.reps) || 0), 0), sets: valid.length };
  }
  return {
    tonnage: valid.reduce((sum, s) => sum + totalLoad(s, ex) * (Number(s.reps) || 0), 0),
    reps: valid.reduce((sum, s) => sum + (Number(s.reps) || 0), 0),
    sets: valid.length
  };
}

function calcWorkoutVolume(workout, exerciseDefs = []) {
  const defs = Object.fromEntries(exerciseDefs.map(ex => [ex.id, ex]));
  const byExercise = {};
  let tonnage = 0, weightedReps = 0, bodyweightReps = 0, sets = 0, benchTonnage = 0;
  Object.entries(workout?.exercises || {}).forEach(([exId, exSets]) => {
    const ex = defs[exId] || { id: exId, name: exId };
    const v = calcExerciseVolume(exSets, ex);
    byExercise[exId] = v;
    if (ex.isIsometric) return; // 等尺は秒数記録なのでトン数・レップに数えない
    tonnage += v.tonnage;
    sets += v.sets;
    if (ex.isBodyweight) bodyweightReps += v.reps;
    else weightedReps += v.reps;
    if (ex.isBench) benchTonnage += v.tonnage;
  });
  return { tonnage, weightedReps, bodyweightReps, sets, benchTonnage, byExercise };
}

function fmtVolume(n) {
  const value = Math.round(Number(n) || 0);
  return value >= 1000 ? `${(value / 1000).toFixed(value >= 10000 ? 1 : 2)}t` : `${value}kg`;
}

// GL Points: Classic Bench Press, Men
const GL_A = 320.98041, GL_B = 281.40258, GL_C = 0.01008;
function calcGLPoints(result, bw) {
  if (!result || !bw) return 0;
  const coeff = 100 / (GL_A - GL_B * Math.exp(-GL_C * bw));
  return Math.round(result * coeff * 100) / 100;
}

// ==================== EXERCISE DEFINITIONS (v32: A / B / C) ====================
// 内部IDは互換のため DAY1/DAY2/DAY3 のまま。表示は A / B / C。
const DAY_TYPES = ['DAY1', 'DAY2', 'DAY3'];

function weekStartDate(cfg, n) {
  const d = parseLocalDate(cfg.start);
  d.setDate(d.getDate() + (n - 1) * 7);
  return d;
}
function fmtMD(d) { return `${d.getMonth() + 1}/${d.getDate()}`; }
function weekGuide(cfg, n) {
  const a = weekStartDate(cfg, n);
  const b = new Date(a); b.setDate(b.getDate() + 6);
  return `W${n} ${fmtMD(a)}〜${fmtMD(b)}`;
}

    acc: { face_pull1: { sets: 3, hint: '@30kg' }, side_raise1: { sets: 3, hint: '@10kg' }, w_chinup: { sets: 3, hint: '自重', reps: '10rep' } },
    note: 'ベンチは触らない。肩周りだけ。' });
  plan.DAY2.push({ n: 1, phase: ph(1), label: '回復週', key: false,

function thirdSingleRpe(w) {
  const sets = (w?.exercises?.bench_heavy || []).filter(s => Number(s.reps) === 1 && Number(s.weight) > 0);
  if (sets.length === 0) return null;
  const top = sets.reduce((a, b) => Number(b.weight) > Number(a.weight) ? b : a);
  return top.rpe ? Number(top.rpe) : null;
}
function evaluatePlanConditions(allWorkouts, cfg) {
  const ws = (allWorkouts || []).filter(w => w.date >= cfg.start);
  const wk = w => peakingWeekNumber(w.date, cfg);
  // 条件①：W2〜5 の肩スコアがすべて ≥4（記録 6セッション以上）
  const c1ws = ws.filter(w => { const n = wk(w); return n >= 2 && n <= 5; });
  const shoulders = c1ws.map(w => Number(w.shoulder) || 0);
  const cond1 = { ok: c1ws.length >= 6 && shoulders.every(s => s >= 4),
    detail: c1ws.length === 0 ? 'W2〜5 未記録' : `肩 ${shoulders.join(',')}（${c1ws.length}件${c1ws.length < 6 ? '・6件未満' : ''}）` };
  // 条件②：W3・4・5 のA日3本目が すべて @≤7.5
  const rpes = [3, 4, 5].map(n => {
    const w = ws.find(x => x.dayType === 'DAY1' && wk(x) === n);
    return { n, rpe: w ? thirdSingleRpe(w) : null };
  });
  const cond2 = { ok: rpes.every(r => r.rpe !== null && r.rpe <= 7.5),
    detail: rpes.map(r => `W${r.n}:${r.rpe === null ? '—' : '@' + r.rpe}`).join(' ') };
  return { cond1, cond2 };
}

function peakingEntry(dayType, n, conds) {
  const arr = PEAKING_PLAN[dayType] || [];
  const e = arr.find(x => x.n === n);
  if (!e) return null;
  if (!e.condWeek || !conds) return e;
  // W6〜7 の条件分岐
  const main = e.main.map(m => ({ ...m }));
  let label = e.label;
  if (conds.cond1.ok) {
    main.forEach(m => { if (m.tag === '2秒ストップ' || m.tag === '3秒ストップ') { m.reps = 4; } });
    label += '・条件①';
  }
  if (dayType === 'DAY1' && conds.cond2.ok) {
    const up = [155, 165, 175];
    let k = 0;
    main.forEach(m => { if (m.tag.startsWith('試合形式')) { m.kg = up[k++]; } });
    label += '・条件②';
  }
  return { ...e, main, label };
}

function daysUntil(fromDate, toDate) {
  const a = new Date(fromDate + 'T00:00:00');

}

// 週内（月〜日）のベンチ系レップ数
function weekBoundsOf(dateStr) {
  const d = parseLocalDate(dateStr);
  const dow = (d.getDay() + 6) % 7; // Mon=0
  const mon = new Date(d); mon.setDate(d.getDate() - dow);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const iso = x => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
  return { from: iso(mon), to: iso(sun) };
}
function benchFamilyReps(exercises) {
  let reps = 0;
  BENCH_FAMILY_IDS.forEach(id => (exercises?.[id] || []).forEach(s => {
    const w = Number(s.weight), r = Number(s.reps);
    if (w > 0 && r > 0) reps += r;
  }));
  return reps;
}
function weeklyBenchReps(allWorkouts, dateStr, excludeId, liveExercises) {
  const { from, to } = weekBoundsOf(dateStr);
  let reps = 0;
  (allWorkouts || []).forEach(w => {
    if (w.date < from || w.date > to || w.id === excludeId) return;
    reps += benchFamilyReps(w.exercises);
  });
  if (liveExercises) reps += benchFamilyReps(liveExercises);
  return { reps, from, to };
}

function buildMenu(dayType, settings, planEntry, timeMode = 80) {
  const menu = buildMenuCore(dayType, settings, planEntry);
  const tm = TIME_MODES[timeMode]?.[dayType];
  if (!tm) return menu;
  const keep = new Set(tm.ids);
  return menu.map(cat => ({
    ...cat,
    items: cat.items.filter(i => keep.has(i.id)).map(i => {
      const over = tm.sets?.[i.id];
      if (!over) return i;
      return { ...i, sets: Math.min(i.sets, over), target: i.target.replace(/\d+セット/, `${over}セット`), timeCut: true };
    })
  })).filter(cat => cat.items.length > 0);

function buildMenuCore(dayType, settings, planEntry) {
  const base = (DEFAULT_MENUS[dayType] || []).map(cat => ({
    cat: cat.cat,
    items: cat.items.map(item => ({...item, isCustom: false}))
  }));

  getCustomExercises(settings)
    .filter(ex => ex.dayType === dayType && !ex.hidden)
    .forEach(ex => {
      const catName = (ex.cat || 'CUSTOM').trim().toUpperCase();
      let cat = base.find(c => c.cat === catName);
      if (!cat) {
        cat = { cat: catName, items: [] };
        base.push(cat);
      }
      cat.items.push({
        id: ex.id,
        name: ex.name || '未設定種目',
        target: ex.target || `${ex.sets || 3}セット`,
        sets: Number(ex.sets) || 3,
        isBench: !!ex.isBench,
        isBodyweight: !!ex.isBodyweight,
        isIsometric: !!ex.isIsometric,
        isLoadedBw: !!ex.isLoadedBw,
        isCustom: true
      });
    });

  // ピーキングモード: 計画にある種目だけを、計画のセット数で表示する
  if (planEntry && planEntry.acc) {
    const acc = planEntry.acc;
    const mainSetCount = {};
    const mainLabel = {};
    (planEntry.main || []).forEach(m => {
      mainSetCount[m.ex] = (mainSetCount[m.ex] || 0) + m.sets;
      mainLabel[m.ex] = (mainLabel[m.ex] ? mainLabel[m.ex] + ' + ' : '') + `${fmtKg(m.kg)}kg×${m.reps}×${m.sets}`;
    });

    // その日のメニューに無いメイン種目（例: テーパー最終日の止めありベンチ）を取り込む
    const known = new Set();
    base.forEach(cat => cat.items.forEach(i => known.add(i.id)));
    const missing = Object.keys(mainSetCount).filter(id => !known.has(id));
    if (missing.length) {
      const pool = [];
      Object.values(DEFAULT_MENUS).forEach(day => day.forEach(cat => cat.items.forEach(i => pool.push(i))));
      const mainCat = base.find(c => c.cat === 'MAIN') || (base.unshift({ cat:'MAIN', items: [] }), base[0]);
      missing.forEach(id => {
        const def = pool.find(i => i.id === id);
        if (def) mainCat.items.unshift({ ...def, isCustom: false });
      });
    }

    base.forEach(cat => {
      cat.items = cat.items.filter(item => mainSetCount[item.id] || acc[item.id])
        .map(item => {
          if (mainSetCount[item.id]) {
            return {
              ...item,
              sets: Math.max(1, mainSetCount[item.id]),
              target: mainLabel[item.id],
              planMain: true
            };
          }
          const spec = acc[item.id];
          // 元の目標レップ数を保持したままセット数だけ計画値に差し替える
          const baseRep = spec.reps || extractRepText(item.target);
          const parts = [];
          if (spec.hint) parts.push(spec.hint);
          if (baseRep) parts.push(baseRep);
          parts.push(`${spec.sets}セット`);
          return {
            ...item,
            sets: spec.sets || item.sets,
            target: parts.join(' × '),
            planHint: spec.hint || ''
          };
        });
    });
    return base.filter(cat => cat.items.length > 0);
  }

  return base;
}

// ==================== VBT: VIDEO RPE ANALYZER ====================
// バーの挙上速度を動画から計測してRPEを推定する。処理は全て端末内で完結。
const PLATE_RADIUS_M = 0.225; // IPF規格プレート直径450mm

// ベンチプレスの平均挙上速度(m/s) → RPE 標準テーブル
const VBT_DEFAULT_TABLE = [
  { v: 0.50, rpe: 6 },
  { v: 0.40, rpe: 7 },
  { v: 0.32, rpe: 8 },
  { v: 0.27, rpe: 8.5 },
  { v: 0.22, rpe: 9 },
  { v: 0.17, rpe: 9.5 },
  { v: 0.12, rpe: 10 },
];

function getVbtSamples(settings) {
  return Array.isArray(settings?.vbtSamples) ? settings.vbtSamples : [];
}

function estimateRpeFromVelocity(vel, settings) {
  const samples = getVbtSamples(settings);
  // 5サンプル以上あれば個人プロファイル（線形回帰）を優先
  if (samples.length >= 5) {
    const xs = samples.map(s => Number(s.velocity)).filter(n => n > 0);
    const ys = samples.map(s => Number(s.rpe));
    const n = xs.length;
    if (n >= 5) {
      const mx = xs.reduce((a, b) => a + b, 0) / n;
      const my = ys.reduce((a, b) => a + b, 0) / n;
      let num = 0, den = 0;
      xs.forEach((x, i) => { num += (x - mx) * (ys[i] - my); den += (x - mx) * (x - mx); });
      if (den > 1e-6) {
        const a = num / den, b = my - a * mx;
        let rpe = a * vel + b;
        rpe = Math.max(5, Math.min(10, Math.round(rpe * 2) / 2));
        return { rpe, source: `個人補正（${n}サンプル学習済み）` };
      }
    }
  }
  // 標準テーブルの線形補間
  const t = VBT_DEFAULT_TABLE;
  if (vel >= t[0].v) return { rpe: t[0].rpe, source: '標準テーブル' };
  if (vel <= t[t.length - 1].v) return { rpe: 10, source: '標準テーブル' };
  for (let i = 0; i < t.length - 1; i++) {
    if (vel <= t[i].v && vel >= t[i + 1].v) {
      const f = (t[i].v - vel) / (t[i].v - t[i + 1].v);
      const rpe = Math.round((t[i].rpe + f * (t[i + 1].rpe - t[i].rpe)) * 2) / 2;
      return { rpe, source: '標準テーブル' };
    }
  }
  return { rpe: 8, source: '標準テーブル' };
}

// グレースケールパッチ抽出（ImageDataから）
function vbtGrayFromImageData(imgData) {
  const { data, width, height } = imgData;
  const out = new Float32Array(width * height);
  for (let i = 0; i < width * height; i++) {
    const o = i * 4;
    out[i] = data[o] * 0.299 + data[o + 1] * 0.587 + data[o + 2] * 0.114;
  }
  return out;
}

// テンプレートマッチング（SSD最小探索）
function vbtMatchTemplate(searchGray, sw, sh, tmpl, tsize) {
  let bestX = 0, bestY = 0, bestScore = Infinity;
  const maxX = sw - tsize, maxY = sh - tsize;
  for (let y = 0; y <= maxY; y++) {
    for (let x = 0; x <= maxX; x++) {
      let score = 0;
      for (let ty = 0; ty < tsize; ty++) {
        const srow = (y + ty) * sw + x;
        const trow = ty * tsize;
        for (let tx = 0; tx < tsize; tx++) {
          const d = searchGray[srow + tx] - tmpl[trow + tx];
          score += d * d;
          if (score >= bestScore) { tx = tsize; ty = tsize; } // early exit
        }
      }
      if (score < bestScore) { bestScore = score; bestX = x; bestY = y; }
    }
  }
  return { x: bestX, y: bestY, score: bestScore };
}

// トラッキング結果からレップ切り出しと速度計算
function vbtAnalyzePositions(rawPositions, metersPerPx) {
  // 時刻昇順の重複除去（iOSのフレームコールバック重複対策）
  const positions = [];
  (rawPositions || []).forEach(pt => {
    if (positions.length === 0 || pt.t > positions[positions.length - 1].t + 1e-4) positions.push(pt);
  });
  if (positions.length < 8 || !metersPerPx) return [];
  const t = positions.map(p => p.t);
  // 高さ（上向き正、メートル）
  const y0 = positions[0].y;
  const rawH = positions.map(p => (y0 - p.y) * metersPerPx);
  // 移動平均で平滑化
  const h = rawH.map((_, i) => {
    let s = 0, c = 0;
    for (let j = Math.max(0, i - 2); j <= Math.min(rawH.length - 1, i + 2); j++) { s += rawH[j]; c++; }
    return s / c;
  });
  // 上昇区間を検出
  const segs = [];
  let start = null;
  for (let i = 1; i < h.length; i++) {
    const dt = t[i] - t[i - 1];
    const v = dt > 0 ? (h[i] - h[i - 1]) / dt : 0;
    if (v > 0.03) {
      if (start === null) start = i - 1;
    } else if (start !== null && v < 0.01) {
      segs.push({ start, end: i - 1 });
      start = null;
    }
  }
  if (start !== null) segs.push({ start, end: h.length - 1 });

  // 区間の結合: スティッキングポイント（グラインド中の停滞）を跨いで1レップに繋げる。
  // レップの境界は「時間」ではなく「バーが下がったか」で判定する。
  // レップ間は必ずバーが大きく降りるので、停滞が長くても沈み込みが5cm未満なら同一レップ。
  const merged = [];
  segs.forEach(seg => {
    const last = merged[merged.length - 1];
    if (last) {
      const gap = t[seg.start] - t[last.end];
      let gapMin = Infinity;
      for (let i = last.end; i <= seg.start; i++) gapMin = Math.min(gapMin, h[i]);
      const segRise = h[seg.end] - h[seg.start];
      // 結合条件: 沈み込み5cm未満 かつ 続きの区間が3cm以上の上昇に寄与（ロックアウト保持中の揺れを除外）
      if (gap < 1.2 && gapMin >= h[last.end] - 0.05 && segRise > 0.03) {
        last.end = seg.end;
        return;
      }
    }
    merged.push({ ...seg });
  });

  // 有効レップ抽出（挙上距離10cm以上・0.12秒以上）
  const reps = [];
  merged.forEach(seg => {
    const rise = h[seg.end] - h[seg.start];
    const dur = t[seg.end] - t[seg.start];
    if (rise >= 0.10 && dur >= 0.12) {
      let peak = 0;
      for (let i = seg.start + 1; i <= seg.end; i++) {
        const dt = t[i] - t[i - 1];
        if (dt > 0) peak = Math.max(peak, (h[i] - h[i - 1]) / dt);
      }
      const mean = rise / dur;
      reps.push({
        rise: Math.round(rise * 100) / 100,
        dur: Math.round(dur * 100) / 100,
        mean: Math.round(mean * 1000) / 1000,
        peak: Math.round(Math.max(peak, mean) * 1000) / 1000
      });
    }
  });
  return reps;
}

function VideoRPEAnalyzer({ settings, onClose, onApply, onSaveSample }) {
  const [phase, setPhase] = useState('pick'); // pick -> calib1 -> calib2 -> ready -> track -> done
  const [reps, setReps] = useState([]);
  const [error, setError] = useState('');
  const [savedSample, setSavedSample] = useState(false);
  const [progress, setProgress] = useState(0);
  const [qualityNotes, setQualityNotes] = useState([]);
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const p = useRef({}).current; // 処理状態

  function reset() {
    setPhase('pick'); setReps([]); setError(''); setSavedSample(false); setProgress(0); setQualityNotes([]);
    p.lostTotal = 0;
    if (p.url) { URL.revokeObjectURL(p.url); p.url = null; }
  }

  useEffect(() => () => { if (p.url) URL.revokeObjectURL(p.url); }, []);

  async function onFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setError('');
    const url = URL.createObjectURL(file);
    p.url = url;
    const video = videoRef.current;
    video.src = url;
    video.muted = true;
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.onloadedmetadata = () => {
      // 処理解像度: 幅最大400px
      const scale = Math.min(1, 400 / video.videoWidth);
      p.pw = Math.round(video.videoWidth * scale);
      p.ph = Math.round(video.videoHeight * scale);
      const canvas = canvasRef.current;
      canvas.width = p.pw;
      canvas.height = p.ph;
      p.ctx = canvas.getContext('2d', { willReadFrequently: true });
      video.currentTime = 0.01;
    };
    video.onseeked = () => {
      if (phase === 'pick' || phase === 'calib1' || phase === 'calib2') {
        p.ctx.drawImage(video, 0, 0, p.pw, p.ph);
        drawMarkers();
      }
    };
    video.onerror = () => setError('動画を読み込めませんでした。別の形式で試してください。');
    setPhase('calib1');
  }

  function drawMarkers() {
    const ctx = p.ctx;
    if (!ctx) return;
    if (p.cx != null) {
      // 中心マーカー
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.cx, p.cy, 5, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p.cx - 9, p.cy); ctx.lineTo(p.cx + 9, p.cy);
      ctx.moveTo(p.cx, p.cy - 9); ctx.lineTo(p.cx, p.cy + 9); ctx.stroke();
      // 縦ガイド線（真上/真下タップの目印）
      if (!p.radiusPx) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,215,0,0.55)';
        ctx.setLineDash([6, 6]);
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(p.cx, 0); ctx.lineTo(p.cx, p.ph); ctx.stroke();
        ctx.restore();
      }
    }
    if (p.radiusPx) {
      // 計測に使う縦半径を線分で表示
      const ey = p.cy + (p.edgeDir || -1) * p.radiusPx;
      ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(p.cx, p.cy); ctx.lineTo(p.cx, ey); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p.cx - 8, ey); ctx.lineTo(p.cx + 8, ey); ctx.stroke();
      ctx.font = '11px sans-serif'; ctx.fillStyle = '#2ecc71';
      ctx.fillText('225mm', p.cx + 10, (p.cy + ey) / 2);
    }
  }

  function canvasCoords(e) {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: cx * (canvas.width / rect.width), y: cy * (canvas.height / rect.height) };
  }

  function onCanvasTap(e) {
    if (phase !== 'calib1' && phase !== 'calib2') return;
    const { x, y } = canvasCoords(e);
    const video = videoRef.current;
    if (phase === 'calib1') {
      p.cx = x; p.cy = y;
      // テンプレート取得（プレート中心周辺）
      const T = 30;
      p.tsize = T;
      const tx = Math.max(0, Math.min(p.pw - T, Math.round(x - T / 2)));
      const ty = Math.max(0, Math.min(p.ph - T, Math.round(y - T / 2)));
      p.ctx.drawImage(video, 0, 0, p.pw, p.ph);
      p.tmpl = vbtGrayFromImageData(p.ctx.getImageData(tx, ty, T, T));
      drawMarkers();
      setPhase('calib2');
    } else {
      const dx = x - p.cx, dy = y - p.cy;
      const r = Math.sqrt(dx * dx + dy * dy);
      if (r < 5) { setError('中心から離れたプレートの縁をタップしてください'); return; }
      const vy = Math.abs(dy);
      // 斜め撮影対応: 垂直成分のみでスケール校正（垂直移動と同じ圧縮率が乗るため角度誤差が相殺される）
      if (vy < r * 0.6) { setError('縦のガイド線に沿って、プレートの「真上」か「真下」の縁をタップしてください'); return; }
      p.edgeDir = dy >= 0 ? 1 : -1;
      p.radiusPx = vy;
      p.metersPerPx = PLATE_RADIUS_M / vy;
      drawMarkers();
      setError('');
      setPhase('ready');
    }
  }

  function startTracking() {
    const video = videoRef.current;
    p.positions = [];
    p.x = p.cx; p.y = p.cy;
    p.lost = 0;
    p.lostTotal = 0;
    setQualityNotes([]);
    setPhase('track');
    video.currentTime = 0;

    const step = (now, meta) => {
      if (video.ended || video.paused && video.ended) { finish(); return; }
      const t = meta ? meta.mediaTime : video.currentTime;
      trackFrame(t);
      setProgress(video.duration ? Math.min(100, Math.round(t / video.duration * 100)) : 0);
      if (video.requestVideoFrameCallback) {
        video.requestVideoFrameCallback(step);
      } else {
        requestAnimationFrame(() => step());
      }
    };

    video.onended = () => finish();
    video.play().then(() => {
      if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(step);
      else requestAnimationFrame(() => step());
    }).catch(() => setError('動画の再生を開始できませんでした'));
  }

  function trackFrame(t) {
    const video = videoRef.current;
    const ctx = p.ctx;
    const T = p.tsize, R = 26;
    ctx.drawImage(video, 0, 0, p.pw, p.ph);

    const sx = Math.max(0, Math.min(p.pw - (2 * R + T), Math.round(p.x - T / 2 - R)));
    const sy = Math.max(0, Math.min(p.ph - (2 * R + T), Math.round(p.y - T / 2 - R)));
    const sw = 2 * R + T, sh = 2 * R + T;
    const searchGray = vbtGrayFromImageData(ctx.getImageData(sx, sy, sw, sh));
    const m = vbtMatchTemplate(searchGray, sw, sh, p.tmpl, T);

    const nx = sx + m.x + T / 2;
    const ny = sy + m.y + T / 2;
    const jump = Math.sqrt((nx - p.x) ** 2 + (ny - p.y) ** 2);
    if (jump < R * 1.6) {
      p.x = nx; p.y = ny;
      p.lost = 0;
      p.lostTotal = p.lostTotal || 0;
      // テンプレートをゆっくり更新（プレート回転に追従）
      const fresh = vbtGrayFromImageData(ctx.getImageData(Math.round(nx - T / 2), Math.round(ny - T / 2), T, T));
      for (let i = 0; i < p.tmpl.length; i++) p.tmpl[i] = p.tmpl[i] * 0.85 + fresh[i] * 0.15;
    } else {
      p.lost++;
      p.lostTotal = (p.lostTotal || 0) + 1;
    }
    // 時刻が進んだフレームのみ記録（重複フレーム対策）
    if (p.positions.length === 0 || t > p.positions[p.positions.length - 1].t + 1e-4) {
      p.positions.push({ t, x: p.x, y: p.y });
    }

    // トラッキング点を描画
    ctx.fillStyle = '#e94560';
    ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(233,69,96,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const recent = p.positions.slice(-30);
    recent.forEach((pt, i) => { i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y); });
    ctx.stroke();
  }

  function finish() {
    const result = vbtAnalyzePositions(p.positions, p.metersPerPx);
    setReps(result);
    setPhase('done');
    const notes = [];
    const lostRatio = p.positions.length > 0 ? (p.lostTotal || 0) / p.positions.length : 0;
    if (lostRatio > 0.12) notes.push('⚠️ 追跡が不安定でした（補助者や器具による遮蔽の可能性）。数値は参考程度に。');
    const bestRise = result.reduce((m, r) => Math.max(m, r.rise), 0);
    if (result.length > 0 && bestRise < 0.2) notes.push('⚠️ 挙上距離が短く検出されています（' + bestRise.toFixed(2) + 'm）。斜め撮影や遮蔽で速度が過小評価されている可能性があります。');
    setQualityNotes(notes);
    if (result.length === 0) setError('レップを検出できませんでした。プレートが常に映っているか、カメラが固定されているか確認してください。');
  }

  const lastRep = reps.length > 0 ? reps[reps.length - 1] : null;
  const est = lastRep ? estimateRpeFromVelocity(lastRep.mean, settings) : null;
  const velLoss = reps.length >= 2 ? Math.round((1 - lastRep.mean / reps[0].mean) * 100) : null;

  return (
    <div className="vbt-overlay">
      <div className="vbt-panel">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <div style={{fontWeight:900,fontSize:15}}>📹 動画RPE判定</div>
          <button className="btn btn-sm btn-outline" onClick={onClose}>✕ 閉じる</button>
        </div>

        {phase === 'pick' && (
          <div>
            <div className="vbt-hint">
              横からの固定アングルで撮影したベンチ動画を選択してください。<br/>
              処理は端末内のみ。動画はアップロードされません。
            </div>
            <label className="btn btn-accent btn-block" style={{textAlign:'center',cursor:'pointer',marginTop:10}}>
              動画を選択
              <input type="file" accept="video/*" onChange={onFile} style={{display:'none'}} />
            </label>
          </div>
        )}

        <video ref={videoRef} style={{display:'none'}} muted playsInline />
        <canvas ref={canvasRef} className="vbt-canvas"
          style={{display: phase==='pick' ? 'none' : 'block'}}
          onClick={onCanvasTap} />

        {phase === 'calib1' && <div className="vbt-hint">① プレートの<b>中心</b>をタップ</div>}
        {phase === 'calib2' && <div className="vbt-hint">② 縦のガイド線に沿って、プレートの<b>上端（または下端）</b>をタップ（450mmプレート基準。縦方向で測ることで斜め撮影の歪みを補正します）</div>}
        {phase === 'ready' && (
          <div>
            <div className="vbt-hint">校正完了。解析を開始してください。</div>
            <div style={{display:'flex',gap:8,marginTop:10}}>
              <button className="btn btn-accent" style={{flex:1}} onClick={startTracking}>▶ 解析開始</button>
              <button className="btn btn-outline" onClick={() => { p.cx = null; p.cy = null; p.radiusPx = null; p.edgeDir = null; setPhase('calib1'); const v = videoRef.current; p.ctx.drawImage(v,0,0,p.pw,p.ph); }}>やり直す</button>
            </div>
          </div>
        )}
        {phase === 'track' && <div className="vbt-hint">解析中... {progress}%（バーを自動追跡しています）</div>}

        {phase === 'done' && reps.length > 0 && (
          <div style={{marginTop:10}}>
            <div className="vbt-result-main">
              <div>
                <div style={{fontSize:11,color:'var(--muted)'}}>最終レップ平均速度</div>
                <div style={{fontSize:28,fontWeight:900}}>{lastRep.mean.toFixed(2)} <span style={{fontSize:13}}>m/s</span></div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:11,color:'var(--muted)'}}>推定RPE</div>
                <div style={{fontSize:28,fontWeight:900,color:'var(--gold)'}}>{est.rpe}</div>
                <div style={{fontSize:9,color:'var(--dim)'}}>{est.source}</div>
              </div>
            </div>

            {reps.map((r, i) => (
              <div key={i} className="vbt-rep-row">
                <span>Rep {i+1}</span>
                <span>平均 {r.mean.toFixed(2)} m/s</span>
                <span>ピーク {r.peak.toFixed(2)}</span>
                <span style={{color:'var(--dim)'}}>{r.rise.toFixed(2)}m/{r.dur.toFixed(2)}s</span>
              </div>
            ))}
            {velLoss !== null && (
              <div style={{fontSize:11,color: velLoss >= 20 ? 'var(--accent2)' : 'var(--muted)',marginTop:6}}>
                速度低下率: {velLoss}%（1レップ目比）{velLoss >= 20 ? ' — 限界に近い状態' : ''}
              </div>
            )}
            {qualityNotes.map((n, i) => (
              <div key={i} style={{fontSize:11,color:'var(--gold)',marginTop:6,lineHeight:1.5}}>{n}</div>
            ))}

            <button className="btn btn-accent btn-block" style={{marginTop:12}}
              onClick={() => onApply(est.rpe)}>
              RPE {est.rpe} を入力欄に反映
            </button>

            <div className="divider" />
            <div style={{fontSize:11,color:'var(--muted)',marginBottom:6}}>
              体感RPEを記録すると、あなた専用の速度→RPE換算が学習されます（現在{getVbtSamples(settings).length}サンプル）
            </div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              {['7','7.5','8','8.5','9','9.5','10'].map(r => (
                <button key={r} className="btn btn-sm btn-outline" disabled={savedSample}
                  onClick={() => { onSaveSample({ velocity: lastRep.mean, rpe: Number(r), date: getToday() }); setSavedSample(true); }}>
                  {r}
                </button>
              ))}
            </div>
            {savedSample && <div style={{fontSize:11,color:'var(--green)',marginTop:6}}>✓ 学習データに追加しました</div>}

            <button className="btn btn-outline btn-block" style={{marginTop:10}} onClick={reset}>別の動画を解析</button>
          </div>
        )}

        {error && <div style={{fontSize:12,color:'var(--accent2)',marginTop:8}}>{error}</div>}
      </div>
    </div>
  );
}

// ==================== REST TIMER ====================
function RestTimer({ onClose }) {
  const [seconds, setSeconds] = useState(180);
  const [running, setRunning] = useState(true);
  const [initial, setInitial] = useState(180);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (running && seconds > 0) {
      intervalRef.current = setInterval(() => setSeconds(s => s - 1), 1000);
    } else if (seconds === 0 && running) {
      setRunning(false);
      try { navigator.vibrate?.([200, 100, 200, 100, 200]); } catch(e) {}
    }
    return () => clearInterval(intervalRef.current);
  }, [running, seconds]);

  const fmt = s => `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
  const presets = [60, 90, 120, 180, 240, 300];

  return (
    <div className="timer-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="timer-label">REST TIMER</div>
      <div className="timer-display" style={{color: seconds === 0 ? 'var(--gold)' : 'var(--text)'}}>
        {fmt(seconds)}
      </div>
      <div style={{display:'flex',gap:8,margin:'20px 0'}}>
        <button className="btn btn-accent" onClick={() => {setRunning(!running)}}>
          {running ? '⏸ 停止' : '▶ 再開'}
        </button>
        <button className="btn btn-outline" onClick={() => {setSeconds(initial);setRunning(true)}}>↺ リセット</button>
        <button className="btn btn-outline" onClick={onClose}>✕ 閉じる</button>
      </div>
      <div style={{display:'flex',gap:6,flexWrap:'wrap',justifyContent:'center'}}>
        {presets.map(p => (
          <button key={p} className="btn btn-sm btn-outline" style={{color: initial===p?'var(--gold)':'var(--muted)'}}
            onClick={() => {setInitial(p);setSeconds(p);setRunning(true)}}>
            {p >= 60 ? `${p/60}分` : `${p}秒`}
          </button>
        ))}
      </div>
    </div>
  );
}
