          <div className="wu-sub">アップの前にやる。可動域を削れる手段はアーチだけ。グリップ81cm固定</div>
        </div>
        <button className="apply-chip" onClick={() => setOpen(o => !o)}>{open ? '閉じる' : '詳細'}</button>
      </div>
      {open && (
        <div className="wu-detail">
          <div className="wu-step">
            {WU_SVG_ROLLER}
            <div>
              <h4>① フォームローラーで胸椎伸展（約1分半）</h4>
              <ol>
                <li>ローラーを肩甲骨の下端に横向きに置いて仰向け。膝を立て、尻は床</li>
                <li>両手を頭の後ろで組み、肘を閉じる（肩甲骨を開く）</li>
                <li>息を吐きながら、ローラーを支点に頭と肩を床へ倒す。腹は軽く締めたまま</li>
                <li>2〜3秒止めて戻す。10回。上に1〜2椎骨ずらしてもう1セット可（合計2分以内）</li>
              </ol>
              <div className="cue">感じる場所はローラーが当たる胸椎の一点。腰や首に来たら腹の締めが抜けているか位置が低い。ローラーがなければ固く丸めたバスタオル、またはベンチ台の端。</div>
            </div>
          </div>
          <div className="wu-step">
            {WU_SVG_ARCH}
            <div>
              <h4>② ベンチ上でアーチ作成（約1分半）</h4>
              <ol>
                <li>いつもの位置に寝る。足は試合の位置</li>
                <li>肩甲骨を寄せて下げ、尻を一度浮かせ、足で押しながら肩の方へ体を詰める</li>
                <li>尻を下ろし、胸が一番高い位置で止める。手は空バーに添えるだけ</li>
                <li>5秒保持。確認：腰でなく胸が上がっているか／頭は付いているか／足裏3点が床か</li>
                <li>力を抜いて3回。3回目の形でその日のセットアップに入る</li>
              </ol>
              <div className="cue">初日から高くならなくて正常。月1回「胸が一番高い位置でのベンチ〜みぞおちの高さ」を撮って比べる。腰に張りが出たら①の腹の締めが足りない。</div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ==================== PEAKING PANEL ====================
function PeakingPanel({ dayType, date, cfg, n, entry, conds, weekly, timeMode, onTimeMode, onPrefill, onSetManual }) {
  if (!cfg || !cfg.enabled) return null;

  const left = daysUntil(date, cfg.comp);
  const weekOpts = Array.from({ length: PEAKING_WEEKS }, (_, i) => i + 1);
  const floorOk = weekly.reps >= WEEKLY_BENCH_FLOOR;

  return (
    <div className={`pk-panel ${entry?.key ? 'pk-key' : ''}`}>
      <div className="pk-top">
        <div>
          <div className="pk-label">{entry ? entry.label : `この週に${dayLabel(dayType)}日はなし`}</div>
          <div className="pk-meta">{dayLabel(dayType)}日 ・ {weekGuide(cfg, n)} ・ {DAY_DESC[dayType]}</div>
        </div>
        <div style={{textAlign:'right'}}>
          {entry && <span className={`pk-phase ${entry.key ? 'gold' : ''}`}>{entry.phase}</span>}
          <div className="pk-meta" style={{marginTop:4}}>
            {left >= 0 ? `試合まで ${left}日` : '試合終了'}
          </div>
        </div>
      </div>

      {entry && entry.main.length > 0 && (
        <div className="pk-rows">
          {entry.main.map((m, i) => (
            <div className="pk-row" key={i}>
              <span className="pk-tag">{m.tag}</span>
              <span className="pk-num">{fmtKg(m.kg)}kg × {m.reps} × {m.sets}</span>
              <span className="pk-cap">{m.cap}</span>
            </div>
          ))}
        </div>
      )}

      {entry?.note && <div className="pk-note">{entry.note}</div>}

      {n >= 2 && n <= 7 && conds && (
        <div className="pk-conds">
          <span className={`pk-cond ${conds.cond1.ok ? 'ok' : ''}`}>①量 {conds.cond1.ok ? '成立' : '未'}：{conds.cond1.detail}</span>
          <span className={`pk-cond ${conds.cond2.ok ? 'ok' : ''}`}>②175 {conds.cond2.ok ? '成立' : '未'}：{conds.cond2.detail}</span>
        </div>
      )}

      <div className="pk-weekly">
        <span>今週ベンチ系 <b style={{color: floorOk ? 'var(--green)' : 'var(--gold)'}}>{weekly.reps}</b> rep</span>
        <span className="pk-meta">床 {WEEKLY_BENCH_FLOOR} / 標準 {n <= 5 ? 59 : n <= 7 ? 71 : '—'}（等尺は数えない・{weekly.from.slice(5)}〜{weekly.to.slice(5)}）</span>
      </div>

      <div className="pk-actions">
        {entry && entry.main.length > 0 && (
          <button className="btn btn-accent btn-sm" onClick={() => onPrefill(entry)}>この重量を入力</button>
        )}
        <select className="pk-sel" value={timeMode} onChange={e => onTimeMode(Number(e.target.value))}>
          {Object.entries(TIME_MODES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
        </select>
        <select className="pk-sel" value={n} onChange={e => onSetManual(Number(e.target.value))}>
          {weekOpts.map(w => {
            const e2 = PEAKING_PLAN[dayType].find(x => x.n === w);
            return <option key={w} value={w}>W{w}: {e2 ? e2.label : 'なし'}</option>;
          })}
        </select>
        {cfg.mode && <span className="pk-modechip">メニュー連動</span>}
      </div>
    </div>
  );
}

// ==================== WORKOUT PAGE ====================
function WorkoutPage({ settings, onSave, allWorkouts }) {
  const [dayType, setDayType] = useState('DAY1');
  const [date, setDate] = useState(getToday());
  const [exerciseData, setExerciseData] = useState({});
  const [shoulder, setShoulder] = useState(3);
  const [notes, setNotes] = useState('');
  const [showTimer, setShowTimer] = useState(false);
  const [vbtTarget, setVbtTarget] = useState(null);
  const [pr, setPr] = useState(null);
  const [expanded, setExpanded] = useState({});
  const [timeMode, setTimeMode] = useState(80);
  const [subs, setSubs] = useState({});
  const [subOpen, setSubOpen] = useState({});
  const [warmupDone, setWarmupDone] = useState(false);

  const pkCfg = useMemo(() => peakingSettings(settings), [settings]);
  const pkNum = useMemo(
    () => peakingSessionNumber(allWorkouts, dayType, date, pkCfg),
    [allWorkouts, dayType, date, pkCfg]
  );
  const conds = useMemo(() => evaluatePlanConditions(allWorkouts, pkCfg), [allWorkouts, pkCfg]);
  const pkEntry = useMemo(
    () => (pkCfg.enabled ? applyTimeModeToEntry(peakingEntry(dayType, pkNum, conds), dayType, timeMode) : null),
    [pkCfg.enabled, dayType, pkNum, conds, timeMode]
  );
  const menu = useMemo(
    () => buildMenu(dayType, settings, pkCfg.mode ? pkEntry : null, timeMode),
    [dayType, settings, pkCfg.mode, pkEntry, timeMode]
  );
  const formula = settings.mainFormula || 'epley';
  const allExerciseDefs = useMemo(() => getAllExerciseDefs(settings), [settings]);

  function getRelatedExerciseIds(ex) {
    const nameKey = normalizeExerciseName(ex.name);
    const ids = new Set([ex.id]);
    allExerciseDefs.forEach(def => {
      if (def.id === ex.id || normalizeExerciseName(def.name) === nameKey) ids.add(def.id);
    });
    return ids;
  }

  function getLastExerciseSession(ex) {
    const relatedIds = getRelatedExerciseIds(ex);
    const history = allWorkouts
      .filter(w => w.date < date)
      .sort((a,b) => b.date.localeCompare(a.date));

    for (const w of history) {
      const matchedSets = [];
      relatedIds.forEach(id => {
        matchedSets.push(...exerciseFilledSets(w.exercises?.[id] || [], ex));
      });
      if (matchedSets.length > 0) {
        return {
          date: w.date,
          dayType: w.dayType,
          sub: w.subs?.[ex.id] || '',
          sets: matchedSets,
          best: bestSetForExercise(matchedSets, ex, formula)
        };
      }
    }
    return null;
  }

  // Load existing workout for this date（日付・日種別が変わった時だけ。時短切替で入力は消さない）
  useEffect(() => {
    (async () => {
      const workouts = await dbGetAll('workouts');
      const existing = workouts.find(w => w.date === date && w.dayType === dayType);
      const init = {};
      menu.forEach(cat => cat.items.forEach(ex => {
        init[ex.id] = Array.from({length: ex.sets}, () => ({weight:'',reps:'',rpe:''}));
      }));
      if (existing) {
        setExerciseData({ ...init, ...(existing.exercises || {}) });
        setShoulder(existing.shoulder || 3);
        setNotes(existing.notes || '');
        setSubs(existing.subs || {});
        setTimeMode(existing.timeMode || 80);
        setWarmupDone(!!existing.warmupDone);
      } else {
        setExerciseData(init);
        setShoulder(3);
        setNotes('');
        setSubs({});
        setTimeMode(80);
        setWarmupDone(false);
      }
    })();
  }, [date, dayType]);

  // メニュー（計画・時短）が変わったら、未登録の種目だけ空セットを足す
  useEffect(() => {
    setExerciseData(prev => {
      const next = { ...prev };
      let changed = false;
      menu.forEach(cat => cat.items.forEach(ex => {
        if (!next[ex.id] || next[ex.id].length === 0) {
          next[ex.id] = Array.from({length: ex.sets}, () => ({weight:'',reps:'',rpe:''}));
          changed = true;
        }
      }));
      return changed ? next : prev;
    });
  }, [menu]);

  // Get previous workout data for comparison
  const prevWorkout = useMemo(() => {
    const prev = allWorkouts
      .filter(w => w.dayType === dayType && w.date < date)
      .sort((a,b) => b.date.localeCompare(a.date))[0];
    return prev?.exercises || {};
  }, [allWorkouts, dayType, date]);

  const liveVolume = useMemo(() => {
    const pseudoWorkout = { exercises: exerciseData };
    return calcWorkoutVolume(pseudoWorkout, allExerciseDefs);
  }, [exerciseData, allExerciseDefs]);

  const weekly = useMemo(
    () => weeklyBenchReps(allWorkouts, date, `${date}_${dayType}`, exerciseData),
    [allWorkouts, date, dayType, exerciseData]
  );

  // 代替：直近2回のこの日の記録で同じ代替を使っていれば「昇格」ヒント
  function subStreak(exId, name) {
    const hist = allWorkouts.filter(w => w.dayType === dayType && w.date < date).sort((a,b) => b.date.localeCompare(a.date));
    let k = 0;
    for (const w of hist) {
      if (!exerciseFilledSets(w.exercises?.[exId] || []).length) continue;
      if (w.subs?.[exId] === name) k++; else break;
      if (k >= 2) break;
    }
    return k;
  }
  function setSub(exId, name) {
    setSubs(prev => { const next = { ...prev }; if (name) next[exId] = name; else delete next[exId]; return next; });
    setSubOpen(prev => ({ ...prev, [exId]: false }));
  }

  function updateSet(exId, setIdx, field, value) {
    setExerciseData(prev => {
      const next = {...prev};
      const sets = [...(next[exId] || [])];
      sets[setIdx] = {...sets[setIdx], [field]: value};
      next[exId] = sets;
      return next;
    });
  }

  function addSet(exId) {
    setExerciseData(prev => {
      const next = {...prev};
      next[exId] = [...(next[exId]||[]), {weight:'',reps:'',rpe:''}];
      return next;
    });
  }

  function removeSet(exId) {
    setExerciseData(prev => {
      const next = {...prev};
      if (next[exId]?.length > 1) next[exId] = next[exId].slice(0, -1);
      return next;
    });
  }

  function prefillFromPlan(entry) {
    setExerciseData(prev => {
      const next = { ...prev };
      const byEx = {};
      entry.main.forEach(m => {
        if (!byEx[m.ex]) byEx[m.ex] = [];
        for (let i = 0; i < m.sets; i++) byEx[m.ex].push({ weight: String(m.kg), reps: String(m.reps), rpe: '' });
      });
      Object.entries(byEx).forEach(([exId, planned]) => {
        const cur = [...(next[exId] || [])];
        planned.forEach((ps, i) => {
          const existing = cur[i] || { weight:'', reps:'', rpe:'' };
          // 入力済みのセットは上書きしない
          cur[i] = (existing.weight || existing.reps) ? existing : { ...existing, ...ps };
        });
        next[exId] = cur;
      });
      return next;
    });
  }

  async function setPlanManual(num) {
    const cfg = peakingSettings(settings);
    const manual = { ...cfg.manual, [`${date}_${dayType}`]: num };
    const nextSettings = { ...settings, key: 'main', peaking: { ...(settings.peaking||{}), enabled: cfg.enabled, start: cfg.start, comp: cfg.comp, manual } };
    await dbPut('settings', nextSettings);
    onSave();
  }

  async function saveVbtSample(sample) {
    const samples = Array.isArray(settings.vbtSamples) ? settings.vbtSamples : [];
    const nextSettings = { ...settings, key: 'main', vbtSamples: [...samples.slice(-49), sample] };
    await dbPut('settings', nextSettings);
    onSave();
  }

  async function save() {
    const workout = {
      id: `${date}_${dayType}`,
      date, dayType,
      exercises: exerciseData,
      shoulder, notes,
      subs, timeMode, warmupDone,
      savedAt: new Date().toISOString()
    };
    await dbPut('workouts', workout);

    // Check PRs
    const allW = await dbGetAll('workouts');
    menu.forEach(cat => cat.items.forEach(ex => {
      const sets = exerciseData[ex.id] || [];

      if (ex.isBodyweight) {
        const sessionBestReps = sets.reduce((best, s) => Math.max(best, Number(s.reps) || 0), 0);
        let previousBestReps = 0;
        allW.forEach(wo => {
          if (wo.id === workout.id) return;
          (wo.exercises?.[ex.id] || []).forEach(ws => {
            previousBestReps = Math.max(previousBestReps, Number(ws.reps) || 0);
          });
        });
        if (sessionBestReps > previousBestReps) {
          setPr({exercise: ex.name, type: 'reps', reps: sessionBestReps});
        }
        return;
      }

      sets.forEach(s => {
        const r = parseInt(s.reps);
        if (!r) return;
        if (!ex.isLoadedBw && !s.weight) return;

        const w = ex.isLoadedBw ? totalLoad(s, ex) : parseFloat(s.weight);
        const e1rm = calcE1RM(w, r, formula);
        // Check if this is a PR for this exercise
        let isPR = true;
        allW.forEach(wo => {
          if (wo.id === workout.id) return;
          const woSets = wo.exercises?.[ex.id] || [];
          woSets.forEach(ws => {
            if (ws.weight && ws.reps) {
              const prevE1rm = calcE1RM(parseFloat(ws.weight), parseInt(ws.reps), formula);
              if (prevE1rm >= e1rm) isPR = false;
            }
          });
        });
        if (isPR && e1rm > 0) {
          setPr({exercise: ex.name, type: 'e1rm', value: e1rm, weight: w, reps: r});
        }
      });
    }));

    // If a bench-type exercise is recorded as an actual single, update the measured bench max.
    let sessionBenchSingleMax = 0;
    menu.forEach(cat => cat.items.forEach(ex => {
      if (!ex.isBench) return;
      (exerciseData[ex.id] || []).forEach(s => {
        const w = parseFloat(s.weight), r = parseInt(s.reps);
        if (w > 0 && r === 1 && w > sessionBenchSingleMax) sessionBenchSingleMax = w;
      });
    }));

    const currentActualMax = Number(settings.actualMax?.bench || 0);
    if (sessionBenchSingleMax > currentActualMax) {
      const nextSettings = {
        ...settings,
        key: 'main',
        actualMax: { ...(settings.actualMax || {}), bench: sessionBenchSingleMax }
      };
      await dbPut('settings', nextSettings);
      setPr({exercise: 'ベンチプレス実測MAX', type: 'actualMax', weight: sessionBenchSingleMax, reps: 1});
    }

    onSave();
  }

  function getBestE1RM(exId, exDef) {
    const sets = exerciseData[exId] || [];
    let best = 0;
    sets.forEach(s => {
      if (exDef?.isLoadedBw) {
        if (!s.reps) return;
        const e = calcE1RM(totalLoad(s, exDef), parseInt(s.reps), formula);
        if (e > best) best = e;
        return;
      }
      if (s.weight && s.reps) {
        const e = calcE1RM(parseFloat(s.weight), parseInt(s.reps), formula);
        if (e > best) best = e;
      }
    });
    return best;
  }

  function getBestReps(exId) {
    return (exerciseData[exId] || []).reduce((best, s) => Math.max(best, Number(s.reps) || 0), 0);
  }

  return (
    <div className="page">
      {showTimer && <RestTimer onClose={() => setShowTimer(false)} />}
      {vbtTarget && <VideoRPEAnalyzer settings={settings}
        onClose={() => setVbtTarget(null)}
        onApply={rpe => { updateSet(vbtTarget.exId, vbtTarget.setIdx, 'rpe', String(rpe)); setVbtTarget(null); }}
        onSaveSample={saveVbtSample} />}
      {pr && <PRBanner pr={pr} onClose={() => setPr(null)} />}

      <div className="page-title">🏋️ トレーニング記録</div>

      <div style={{display:'flex',gap:8,marginBottom:12}}>
        <input type="date" value={date} onChange={e => setDate(e.target.value)}
          className="input-md" style={{flex:1}} />
        <button className="btn btn-accent btn-sm" onClick={() => setShowTimer(true)}>⏱ Timer</button>
      </div>

      <div className="tabs" style={{gridTemplateColumns:'repeat(3,minmax(0,1fr))'}}>
        {DAY_TYPES.map(dt => (
          <div key={dt} className={`tab ${dayType===dt?'active':''}`} onClick={() => setDayType(dt)}>{dayLabel(dt)}</div>
        ))}
      </div>

      <PeakingPanel
        dayType={dayType}
        date={date}
        cfg={pkCfg}
        n={pkNum}
        entry={pkEntry}
        conds={conds}
        weekly={weekly}
        timeMode={timeMode}
        onTimeMode={setTimeMode}
        onPrefill={prefillFromPlan}
        onSetManual={setPlanManual}
      />

      <WarmupCard done={warmupDone} onToggle={() => setWarmupDone(d => !d)} />

      <MaxChallengeScorePanel
        workouts={allWorkouts}
        settings={settings}
        formula={formula}
        asOfDate={date}
        compact={true}
      />

      {menu.map(cat => (
        <div key={cat.cat}>
          <div className="cat-label">{cat.cat}</div>
          {cat.items.map(ex => {
            const sets = exerciseData[ex.id] || [];
            const bestE1rm = getBestE1RM(ex.id, ex);
            const bestReps = ex.isBodyweight ? getBestReps(ex.id) : 0;
            const isOpen = expanded[ex.id] !== false;
            const prevSets = prevWorkout[ex.id] || [];
            const lastSession = getLastExerciseSession(ex);
            const maxTargets = getMaxBasedTargets(ex, settings);
            const targetRepRange = parseTargetRepRange(ex.target);
            const subList = getSubstitutes(ex.id);
            const curSub = subs[ex.id] || '';
            const curSubDef = subList.find(a => a.name === curSub);
            const lastOrigWeight = lastSession?.best?.weight ? Number(lastSession.best.weight) : 0;
            const subHintKg = (curSubDef && curSubDef.ratio && lastOrigWeight && !lastSession?.sub) ? roundToPlate(lastOrigWeight * curSubDef.ratio) : 0;
            const streak = curSub ? subStreak(ex.id, curSub) : 0;

            return (
              <div className={`ex-card ${curSub ? 'ex-sub' : ''}`} key={ex.id}>
                <div className="ex-header" onClick={() => setExpanded(p => ({...p, [ex.id]: !isOpen}))}>
                  <div style={{minWidth:0}}>
                    <div className="ex-name">{ex.name}{curSub && <span className="sub-chip">⇄ {curSub}</span>}</div>
                    <div className="ex-target">{curSubDef ? `${curSubDef.reps || ''} × ${ex.sets}セット${curSubDef.note ? ' / ' + curSubDef.note : ''}` : ex.target}</div>
                  </div>
                  <div style={{textAlign:'right'}}>
                    {ex.isIsometric && lastSession?.best?.weight > 0 && <div className="ex-e1rm">動かない重さ {fmtKg(lastSession.best.weight)}kg</div>}
                    {!ex.isBodyweight && !ex.isIsometric && bestE1rm > 0 && <div className="ex-e1rm">e1RM {bestE1rm}kg</div>}
                    {ex.isBodyweight && bestReps > 0 && <div className="ex-e1rm">Best {bestReps}rep</div>}
                    <div style={{fontSize:10,color:'var(--dim)'}}>{isOpen ? '▲' : '▼'}</div>
                  </div>
                </div>
                {isOpen && (
                  <div className="ex-body">
                    {ex.isBodyweight ? (
                      <div className="set-row" style={{marginBottom:8}}>
                        <div className="set-num"></div>
                        <div style={{width:92,textAlign:'center',fontSize:10,color:'var(--dim)'}}>Rep</div>
                        <div style={{width:60,textAlign:'center',fontSize:10,color:'var(--dim)'}}>RPE</div>
                        <div style={{flex:1,textAlign:'right',fontSize:10,color:'var(--dim)'}}>回数基準</div>
                      </div>
                    ) : (
                      <div className="set-row" style={{marginBottom:8}}>
                        <div className="set-num"></div>
                        <div style={{width:60,textAlign:'center',fontSize:10,color:'var(--dim)'}}>重量</div>
                        <div style={{width:48,textAlign:'center',fontSize:10,color:'var(--dim)'}}>Rep</div>
                        <div style={{width:76,textAlign:'center',fontSize:10,color:'var(--dim)'}}>感覚</div>
                        {ex.isBench && <div style={{width:42,textAlign:'center',fontSize:10,color:'var(--dim)'}}>RPE</div>}
                        {!ex.isBench && <div style={{width:44,textAlign:'center',fontSize:10,color:'var(--dim)'}}>RPE</div>}
                        <div style={{flex:1,textAlign:'right',fontSize:10,color:'var(--dim)'}}>e1RM</div>
                      </div>
                    )}
                    {subList.length > 0 && (
                      <div className="sub-box">
                        <div className="sub-head">
                          <span>代替種目</span>
                          <button className="apply-chip" onClick={() => setSubOpen(p => ({...p, [ex.id]: !p[ex.id]}))}>
                            {subOpen[ex.id] ? '閉じる' : (curSub ? '変更' : '⇄ 代替にする')}
                          </button>
                          {curSub && <button className="apply-chip" onClick={() => setSub(ex.id, '')}>本種目に戻す</button>}
                        </div>
                        {subOpen[ex.id] && (
                          <div className="sub-opts">
                            {subList.map((a, idx) => (
                              <button key={a.name} className={`sub-opt ${curSub === a.name ? 'on' : ''}`} onClick={() => setSub(ex.id, a.name)}>

                            {subHintKg > 0 && <span>初回目安 {fmtKg(subHintKg)}kg（前回{fmtKg(lastOrigWeight)}kg×{curSubDef.ratio}）</span>}

                      <div className="target-guide">
                        <div className="target-guide-head">
                          <span className="target-guide-title">MAX基準の目標重量</span>
                          <span>{settings.actualMax?.bench || 0}kg基準</span>

                        <div className="target-guide-chips">
                          {maxTargets.map(t => (
                            <span className="target-chip" key={t.pct}>{t.pct}% = {fmtKg(t.kg)}kg</span>

                        </div>
                      </div>
                    )}
                    {lastSession ? (
                      <div className="prev-history">
                        <div className="prev-history-head">
                          <span className="prev-history-title">前回同種目{lastSession.sub ? `（代替: ${lastSession.sub}）` : ''}</span>
                          <span>{lastSession.date.slice(5)} / {dayLabel(lastSession.dayType)}</span>
                        </div>
                        <div className="prev-history-sets">
                          {lastSession.sets.slice(0, 6).map((ps, idx) => (
                            <span className="prev-chip" key={idx}>{fmtSet(ps, ex)}</span>
                          ))}
                          {lastSession.sets.length > 6 && <span className="prev-chip">+{lastSession.sets.length - 6}</span>}
                        </div>
                        {lastSession.best && (
                          <div className="prev-best">
                            {ex.isBodyweight
                              ? `前回ベスト: ${fmtSet(lastSession.best, ex)}`
                              : <>前回ベスト: {fmtSet(lastSession.best, ex)} / e1RM {lastSession.best.e1rm}kg</>}
                          </div>
                        )}
                      </div>
                    ) : (
                      <div className="prev-empty">前回同種目の記録なし</div>
                    )}
                    {sets.map((s, i) => {
                      const e1rm = ex.isLoadedBw
                        ? (s.reps ? calcE1RM(totalLoad(s, ex), parseInt(s.reps), formula) : 0)
                        : ((s.weight && s.reps) ? calcE1RM(parseFloat(s.weight), parseInt(s.reps), formula) : 0);
                      const prev = prevSets[i];
                      const suggestion = getSetRecommendation(ex, prev, targetRepRange);
                      return (
                        <div key={i}>
                          <div className="set-row">
                            <div className="set-num">{i+1}</div>
                            {ex.isBodyweight ? (
                              <>
                                <input className="input-sm" style={{width:92}} placeholder="rep" value={s.reps}
                                  type="number" inputMode="numeric" min="0"
                                  onChange={e => updateSet(ex.id, i, 'reps', e.target.value)} />
                                <input className="input-sm" style={{width:60}} placeholder="RPE" value={s.rpe||''}
                                  type="number" inputMode="decimal" step="0.5" min="1" max="10"
                                  onChange={e => updateSet(ex.id, i, 'rpe', e.target.value)} />
                                <div className="set-e1rm" style={{flex:1}}>{s.reps ? `${s.reps}rep` : ''}</div>
                              </>
                            ) : (
                              <>
                                <input className="input-sm" style={{width:60}} placeholder={ex.isLoadedBw ? '+kg' : 'kg'} value={s.weight}
                                  type="number" inputMode="decimal" step="0.5"
                                  onChange={e => updateSet(ex.id, i, 'weight', e.target.value)} />
                                <input className="input-sm" style={{width:48}} placeholder="rep" value={s.reps}
                                  type="number" inputMode="numeric"
                                  onChange={e => updateSet(ex.id, i, 'reps', e.target.value)} />
                                {(ex.isBench || ex.id === 'pin_press') ? (
                                  <>
                                    <select
                                      className="effort-select"
                                      value={String(s.rpe || '')}
                                      title={s.rpe ? `${effortLabelFromRpe(s.rpe)} / RPE ${s.rpe}` : '感覚を選択'}
                                      onChange={e => updateSet(ex.id, i, 'rpe', e.target.value)}
                                    >
                                      <option value="">未選択</option>
                                      {s.rpe && !EFFORT_OPTIONS.some(opt => opt.rpe === String(s.rpe)) && (
                                        <option value={String(s.rpe)}>手入力</option>
                                      )}
                                      {EFFORT_OPTIONS.map(opt => (
                                        <option key={opt.key} value={opt.rpe}>{opt.label} (RPE{opt.rpe})</option>
                                      ))}
                                    </select>
                                    <input className="input-sm" style={{width:42}} placeholder="RPE" value={s.rpe||''}
                                      type="number" inputMode="decimal" step="0.5" min="1" max="10"
                                      onChange={e => updateSet(ex.id, i, 'rpe', e.target.value)} />
                                  </>
                                ) : (
                                  <>
                                    <div style={{width:76}}></div>
                                    <input className="input-sm" style={{width:44}} placeholder="RPE" value={s.rpe||''}
                                      type="number" inputMode="decimal" step="0.5" min="1" max="10"
                                      onChange={e => updateSet(ex.id, i, 'rpe', e.target.value)} />
                                  </>
                                )}
                                <div className="set-e1rm">{e1rm > 0 ? `${e1rm}` : ''}</div>
                              </>
                            )}
                            {ex.isBench && (
                              <button className="btn-vbt" title="動画からRPEを判定"
                                onClick={() => setVbtTarget({exId: ex.id, setIdx: i})}>📹</button>
                            )}
                          </div>
                          {prev && isExerciseSetFilled(prev, ex) && (
                            <div style={{fontSize:10,color:'var(--dim)',marginLeft:30,marginBottom:4}}>
                              前回同メニューSet{i+1}: {fmtSet(prev, ex)}
                            </div>
                          )}
                          {suggestion && (
                            <div className={`set-suggestion ${suggestion.achieved ? 'up' : ''}`}>
                              {suggestion.mode === 'reps' ? (
                                <>
                                  <span>{suggestion.label}: {suggestion.reps}rep</span>
                                  <span>（{suggestion.reason}）</span>
                                  <button className="apply-chip" onClick={() => updateSet(ex.id, i, 'reps', String(suggestion.reps))}>回数入力</button>
                                </>
                              ) : (
                                <>
                                  <span>{suggestion.label}: {fmtKg(suggestion.kg)}kg</span>
                                  <span>（{suggestion.reason}{suggestion.achieved ? ' → +2.5kg' : ''}）</span>
                                  <button className="apply-chip" onClick={() => updateSet(ex.id, i, 'weight', String(suggestion.kg))}>重量入力</button>
                                </>
                              )}
                            </div>
                          )}
                        </div>
                      );
                    })}
                    <div style={{display:'flex',gap:6,marginTop:6}}>
                      <button className="btn btn-sm btn-outline" onClick={() => addSet(ex.id)}>+ Set</button>
                      {sets.length > 1 && <button className="btn btn-sm btn-outline" onClick={() => removeSet(ex.id)}>- Set</button>}
                      <button className="btn btn-sm btn-outline" style={{marginLeft:'auto'}}
                        onClick={() => setShowTimer(true)}>⏱</button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ))}

      <div className="card">
        <div className="card-title">今回のトレーニングボリューム</div>
        <div className="volume-grid">
          <div className="volume-stat"><div className="value">{fmtVolume(liveVolume.tonnage)}</div><div className="label">総重量（重量×rep）</div></div>
          <div className="volume-stat"><div className="value">{fmtVolume(liveVolume.benchTonnage)}</div><div className="label">ベンチ総重量</div></div>
          <div className="volume-stat"><div className="value">{liveVolume.sets}</div><div className="label">完了セット</div></div>
          <div className="volume-stat"><div className="value">{liveVolume.bodyweightReps}</div><div className="label">自重系合計rep</div></div>
        </div>
        <div style={{fontSize:10,color:'var(--dim)',marginTop:8}}>自重系は重量換算せず、合計repとして別集計します。</div>
      </div>

      <div className="card">
        <div className="card-title">肩コンディション</div>
        <div className="shoulder-bar">
          {[1,2,3,4,5].map(n => (
            <div key={n} className={`shoulder-dot ${shoulder===n?'active':''}`}

}

// ==================== CALENDAR PAGE ====================
function CalendarPage({ workouts, settings }) {
  const [year, setYear] = useState(new Date().getFullYear());
  const [month, setMonth] = useState(new Date().getMonth());
  const [selected, setSelected] = useState(null);

  const days = ['月','火','水','木','金','土','日'];
  const first = new Date(year, month, 1);
  let startDay = first.getDay() - 1; if (startDay < 0) startDay = 6;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = getToday();

  const workoutMap = useMemo(() => {
    const map = {};
    workouts.forEach(w => {
      if (!map[w.date]) map[w.date] = [];
      map[w.date].push(w.dayType);
    });
    return map;
  }, [workouts]);

  function prevMonth() { if (month === 0) { setMonth(11); setYear(y => y-1); } else setMonth(m => m-1); }
  function nextMonth() { if (month === 11) { setMonth(0); setYear(y => y+1); } else setMonth(m => m+1); }

  const selectedWorkouts = selected ? workouts.filter(w => w.date === selected) : [];

  const monthCount = workouts.filter(w => {
    const d = new Date(w.date);
    return d.getFullYear() === year && d.getMonth() === month;
  }).length;

  return (
    <div className="page">
      <div className="page-title">📅 カレンダー</div>
      <div className="cal-nav">
        <button className="btn btn-sm btn-outline" onClick={prevMonth}>◀</button>
        <div className="cal-month">{year}年 {month+1}月 <span style={{fontSize:12,color:'var(--muted)'}}>({monthCount}回)</span></div>
        <button className="btn btn-sm btn-outline" onClick={nextMonth}>▶</button>
      </div>
      <div className="cal-grid">
        {days.map(d => <div className="cal-head" key={d}>{d}</div>)}
        {Array.from({length: startDay}, (_, i) => <div className="cal-day empty" key={`e${i}`} />)}
        {Array.from({length: daysInMonth}, (_, i) => {
          const d = i + 1;
          const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const types = workoutMap[dateStr] || [];
          const hasD1 = types.includes('DAY1'), hasD2 = types.includes('DAY2'), hasD3 = types.includes('DAY3');
          let cls = 'cal-day';
          if (dateStr === today) cls += ' today';
          if (types.length >= 2) cls += ' has-both';
          else if (hasD1) cls += ' has-d1';
          else if (hasD2) cls += ' has-d2';
          else if (hasD3) cls += ' has-d3';

          return (
            <div className={cls} key={d} onClick={() => setSelected(dateStr === selected ? null : dateStr)}>
              {d}
            </div>
          );
        })}
      </div>

      <div style={{display:'flex',gap:12,justifyContent:'center',margin:'12px 0',fontSize:11}}>
        <span><span className="badge badge-d1">■</span> A</span>
        <span><span className="badge badge-d2">■</span> B</span>
        <span><span className="badge badge-d3">■</span> C</span>
      </div>

      {selected && (
        <div className="card" style={{marginTop:8}}>
          <div className="card-title">{selected}</div>
          <MaxChallengeScorePanel
            workouts={workouts}
            settings={settings}
            formula={settings.mainFormula || 'epley'}
            asOfDate={selected}
            compact={true}
          />
          {selectedWorkouts.length === 0 ? (
            <div style={{color:'var(--dim)',fontSize:12}}>記録なし</div>
          ) : selectedWorkouts.map(w => (
            <div key={w.id} style={{marginBottom:8}}>
              <div style={{fontWeight:700,marginBottom:4}}>
                <span className={`badge ${w.dayType==='DAY1'?'badge-d1':w.dayType==='DAY2'?'badge-d2':'badge-d3'}`}>{dayLabel(w.dayType)}</span>
                {w.shoulder && <span style={{marginLeft:8,fontSize:11,color:'var(--dim)'}}>肩: {w.shoulder}/5</span>}
                {w.timeMode && w.timeMode !== 80 && <span style={{marginLeft:8,fontSize:11,color:'var(--gold)'}}>{w.timeMode}分</span>}
                {w.warmupDone && <span style={{marginLeft:8,fontSize:11,color:'var(--green)'}}>ドリル✓</span>}
              </div>
              {Object.entries(w.exercises || {}).map(([exId, sets]) => {
                const allExs = getAllExerciseDefs(settings);
                const ex = allExs.find(e => e.id === exId);
                const validSets = exerciseFilledSets(sets, ex);
                if (validSets.length === 0) return null;
                return (
                  <div key={exId} style={{fontSize:12,marginBottom:4}}>
                    <span style={{color:'var(--muted)'}}>{ex?.name || exName(exId)}{w.subs?.[exId] ? `→${w.subs[exId]}` : ''}:</span>{' '}
                    {validSets.map((s,i) => <span key={i}>{fmtSet(s, ex)}{i<validSets.length-1?', ':''}</span>)}
                  </div>
                );
              })}
              {w.notes && <div style={{fontSize:11,color:'var(--dim)',marginTop:4}}>📝 {w.notes}</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ==================== VOLUME PAGE ====================
function VolumePanel({ workouts, settings }) {
  const [metric, setMetric] = useState('total');
  const chartRef = useRef(null);
  const chartInstance = useRef(null);
  const defs = useMemo(() => getAllExerciseDefs(settings), [settings]);
  const options = useMemo(() => {
    const base = [
      { value:'total', label:'全種目の総重量' },
      { value:'bench', label:'ベンチ総重量' },
      { value:'bodyweight', label:'自重系合計rep' },
      { value:'sets', label:'完了セット数' }
    ];
    defs.forEach(ex => base.push({ value:`ex:${ex.id}`, label:`${ex.name}（${dayLabel(ex.dayType)}）${ex.isBodyweight?'：rep':'：総重量'}` }));
    return base;
  }, [defs]);

  const points = useMemo(() => [...workouts].sort((a,b) => a.date.localeCompare(b.date) || a.dayType.localeCompare(b.dayType)).map(w => {
    const v = calcWorkoutVolume(w, defs);
    let value = 0;
    if (metric === 'total') value = v.tonnage;
    else if (metric === 'bench') value = v.benchTonnage;
    else if (metric === 'bodyweight') value = v.bodyweightReps;
    else if (metric === 'sets') value = v.sets;
    else if (metric.startsWith('ex:')) {
      const exId = metric.slice(3);
      const ex = defs.find(d => d.id === exId);
      const ev = v.byExercise[exId] || {tonnage:0,reps:0};
      value = ex?.isBodyweight ? ev.reps : ev.tonnage;
    }
    return { label:`${w.date.slice(5)} ${dayLabel(w.dayType)}`, value };
  }).filter(p => p.value > 0), [workouts, defs, metric]);

  useEffect(() => {
    if (!chartRef.current) return;
    if (chartInstance.current) chartInstance.current.destroy();
    chartInstance.current = new Chart(chartRef.current, {
      type:'line',
      data:{labels:points.map(p=>p.label),datasets:[{data:points.map(p=>p.value),borderColor:'#3498db',backgroundColor:'rgba(52,152,219,.12)',fill:true,tension:.3,pointRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#a0a0b0',font:{size:9}},grid:{color:'#2a2a4a'}},y:{beginAtZero:true,ticks:{color:'#a0a0b0',font:{size:10}},grid:{color:'#2a2a4a'}}}}
    });
    return () => chartInstance.current?.destroy();
  }, [points]);

  const latest = points.at(-1)?.value || 0;
  const prev = points.at(-2)?.value || 0;
  const delta = prev ? Math.round((latest-prev)/prev*100) : null;
  const isRepMetric = metric === 'bodyweight' || (metric.startsWith('ex:') && defs.find(d=>d.id===metric.slice(3))?.isBodyweight) || metric === 'sets';
  return <>
    <select value={metric} onChange={e=>setMetric(e.target.value)} style={{width:'100%',marginBottom:12}}>{options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</select>
    <div className="card">
      <div className="card-title">ボリューム推移</div>
      <div className="chart-container"><canvas ref={chartRef}/></div>
    </div>
    <div className="card">
      <div className="stat-row"><span className="stat-label">直近</span><span className="stat-value gold">{isRepMetric ? latest : fmtVolume(latest)}</span></div>
      <div className="stat-row"><span className="stat-label">前回比</span><span style={{fontWeight:700}}>{delta===null?'—':`${delta>=0?'+':''}${delta}%`}</span></div>
      <div style={{fontSize:10,color:'var(--dim)',marginTop:6}}>総重量＝重量×repの合計。自重系は重量換算せずrep推移として表示します。</div>
    </div>
  </>;
}

function E1RMPage({ workouts, settings }) {
  const [tab, setTab] = useState('chart');
  const [calcWeight, setCalcWeight] = useState('');
  const [calcReps, setCalcReps] = useState('');
  const [chartExercise, setChartExercise] = useState('bench_all');
  const [challengeDate, setChallengeDate] = useState(getToday());
  const formula = settings.mainFormula || 'epley';
  const chartRef = useRef(null);
  const chartInstance = useRef(null);

  const exerciseDefs = useMemo(() => getAllExerciseDefs(settings), [settings]);

  const allExercises = useMemo(() => {
    const exs = {};
    exerciseDefs.forEach(ex => { exs[ex.id] = ex.name; });
    return exs;
  }, [exerciseDefs]);

  const benchExerciseIds = useMemo(() => {
    const benchKey = normalizeExerciseName('ベンチプレス');
    return exerciseDefs
      .filter(ex => ex.id === 'bench_heavy' || ex.id === 'bench_mod' || normalizeExerciseName(ex.name) === benchKey)
      .map(ex => ex.id);
  }, [exerciseDefs]);

  const chartOptions = useMemo(() => {
    const duplicateNameCounts = {};
    exerciseDefs.forEach(ex => {
      const key = normalizeExerciseName(ex.name);
      duplicateNameCounts[key] = (duplicateNameCounts[key] || 0) + 1;
    });

    const opts = [];
    if (benchExerciseIds.length > 0) {
      opts.push({ value: 'bench_all', label: 'ベンチプレス（統合）' });
    }

    exerciseDefs.filter(ex => !ex.isBodyweight && !ex.isIsometric).forEach(ex => {
      const key = normalizeExerciseName(ex.name);
      const needsDayLabel = duplicateNameCounts[key] > 1 || benchExerciseIds.includes(ex.id);
      opts.push({
        value: ex.id,
        label: needsDayLabel ? `${ex.name}（${dayLabel(ex.dayType)}）` : ex.name
      });
    });
    return opts;
  }, [exerciseDefs, benchExerciseIds]);

  // Calculator results
  const calcResults = useMemo(() => {
    const w = parseFloat(calcWeight), r = parseInt(calcReps);
    if (!w || !r || r < 1) return null;
    return calcAllE1RM(w, r);
  }, [calcWeight, calcReps]);

  // Percentage table from recommended e1RM
  const pctTable = useMemo(() => {
    if (!calcResults) return [];
    const e1rm = calcResults.median;
    return [100,95,90,85,80,75,70,65,60,55,50].map(pct => ({
      pct,
      kg: Math.round(e1rm * pct / 100 / 2.5) * 2.5,
      reps: pct >= 95 ? '1' : pct >= 90 ? '1-3' : pct >= 85 ? '3-5' : pct >= 80 ? '5-8' :
            pct >= 75 ? '8-10' : pct >= 70 ? '10-12' : '12+'
    }));
  }, [calcResults]);

  // Chart data
  useEffect(() => {
    if (tab !== 'chart' || !chartRef.current) return;
    if (chartInstance.current) chartInstance.current.destroy();

    const selectedExerciseIds = chartExercise === 'bench_all' ? benchExerciseIds : [chartExercise];
    const relevant = workouts
      .filter(w => selectedExerciseIds.some(exId => w.exercises?.[exId]))
      .sort((a,b) => a.date.localeCompare(b.date));

    const labels = [];
    const data = [];
    relevant.forEach(w => {
      let best = 0;
      selectedExerciseIds.forEach(exId => {
        (w.exercises?.[exId] || []).forEach(s => {
          if (s.weight && s.reps) {
            const e = calcE1RM(parseFloat(s.weight), parseInt(s.reps), formula);
            if (e > best) best = e;
          }
        });
      });
      if (best > 0) {
        labels.push(w.date.slice(5));
        data.push(best);
      }
    });

    chartInstance.current = new Chart(chartRef.current, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'e1RM (kg)',
          data,
          borderColor: '#e94560',
          backgroundColor: 'rgba(233,69,96,0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 4,
          pointBackgroundColor: '#e94560',
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#a0a0b0', font: { size: 10 } }, grid: { color: '#2a2a4a' } },
          y: { ticks: { color: '#a0a0b0', font: { size: 10 } }, grid: { color: '#2a2a4a' } }
        }
      }
    });

    return () => { if (chartInstance.current) chartInstance.current.destroy(); };
  }, [tab, chartExercise, workouts, formula, benchExerciseIds]);

  // Actual max comparison
  const actualMax = settings.actualMax?.bench || 185;
  const isBenchChart = chartExercise === 'bench_all' || benchExerciseIds.includes(chartExercise);
  const chartLabel = chartOptions.find(o => o.value === chartExercise)?.label || allExercises[chartExercise] || '選択種目';

  return (
    <div className="page">
      <div className="page-title">📊 推定1RM</div>

      <div className="tabs e1rm-tabs">
        <div className={`tab ${tab==='chart'?'active':''}`} onClick={() => setTab('chart')}>推移</div>
        <div className={`tab ${tab==='challenge'?'active':''}`} onClick={() => setTab('challenge')}>MAX判定</div>
        <div className={`tab ${tab==='volume'?'active':''}`} onClick={() => setTab('volume')}>Volume</div>
        <div className={`tab ${tab==='calc'?'active':''}`} onClick={() => setTab('calc')}>計算機</div>
        <div className={`tab ${tab==='pr'?'active':''}`} onClick={() => setTab('pr')}>PR</div>
      </div>

      {tab === 'chart' && (
        <>
          <select value={chartExercise} onChange={e => setChartExercise(e.target.value)}
            style={{width:'100%',marginBottom:12}}>
            {chartOptions.map(opt => (
              <option key={opt.value} value={opt.value}>{opt.label}</option>
            ))}
          </select>
          <div className="card">
            <div className="card-title">e1RM推移：{chartLabel} ({FORMULAS[formula].name}式)</div>
            <div className="chart-container">
              <canvas ref={chartRef} />
            </div>
          </div>
          {isBenchChart && (
            <div className="card">
              <div className="stat-row">
                <span className="stat-label">実測MAX（コールあり）</span>
                <span className="stat-value gold">{actualMax}kg</span>
              </div>
            </div>
          )}
        </>
      )}

      {tab === 'volume' && <VolumePanel workouts={workouts} settings={settings} />}

      {tab === 'challenge' && (
        <MaxChallengeScorePanel
          workouts={workouts}
          settings={settings}
          formula={formula}
          asOfDate={challengeDate}
          onDateChange={setChallengeDate}
        />
      )}

      {tab === 'calc' && (
        <>
          <div className="card">
            <div className="card-title">重量とレップを入力</div>
            <div className="input-row" style={{marginBottom:12}}>
              <input className="input-md" placeholder="重量 (kg)" type="number" inputMode="decimal"
                value={calcWeight} onChange={e => setCalcWeight(e.target.value)} />
              <input className="input-md" placeholder="レップ数" type="number" inputMode="numeric"
                value={calcReps} onChange={e => setCalcReps(e.target.value)} />
            </div>
            {calcResults && (
              <>
                <div style={{textAlign:'center',padding:'12px 0',borderBottom:'1px solid var(--border)',marginBottom:12}}>
                  <div style={{fontSize:11,color:'var(--muted)'}}>推奨 e1RM（中央値）</div>
                  <div style={{fontSize:36,fontWeight:900,color:'var(--gold)'}}>{calcResults.median} kg</div>
                  <div style={{fontSize:11,color:'var(--dim)'}}>GL Points: {calcGLPoints(calcResults.median, 67).toFixed(1)}</div>
                </div>
                <table className="formula-table">
                  <thead><tr><th>公式</th><th>e1RM</th><th>特徴</th></tr></thead>
                  <tbody>
                    {Object.entries(FORMULAS).map(([k,v]) => (
                      <tr key={k} className={k===formula?'recommended':''}>
                        <td style={{fontWeight:k===formula?700:400}}>{v.name}</td>
                        <td style={{fontWeight:700,color:k===formula?'var(--gold)':'var(--text)'}}>{calcResults[k]} kg</td>
                        <td style={{fontSize:10,color:'var(--dim)'}}>{v.desc}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </>
            )}
          </div>

          {pctTable.length > 0 && (
            <div className="card">
              <div className="card-title">%1RM 重量早見表（2.5kg丸め）</div>
              <div className="pct-grid">
                {pctTable.map(p => (
                  <div className="pct-cell" key={p.pct}>
                    <div className="pct">{p.pct}%</div>
                    <div className="kg">{p.kg}kg</div>
                    <div style={{fontSize:9,color:'var(--dim)'}}>{p.reps}rep</div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </>
      )}

      {tab === 'pr' && <PRList workouts={workouts} formula={formula} allExercises={allExercises} exerciseDefs={exerciseDefs} />}
    </div>
  );
}

function PRList({ workouts, formula, allExercises, exerciseDefs }) {
  const prs = useMemo(() => {
    const best = {};
    const defsById = Object.fromEntries((exerciseDefs || []).map(ex => [ex.id, ex]));
    [...workouts].sort((a,b) => a.date.localeCompare(b.date)).forEach(w => {
      Object.entries(w.exercises || {}).forEach(([exId, sets]) => {
        const ex = defsById[exId];
        sets.forEach(s => {
          const rp = parseInt(s.reps);
          if (!rp) return;

          if (ex?.isBodyweight) {
            if (!best[exId] || rp > best[exId].reps) {
              best[exId] = { exId, type: 'reps', reps: rp, date: w.date };
            }
            return;
          }

          if (!s.weight) return;
          const wt = parseFloat(s.weight);
          const e1rm = calcE1RM(wt, rp, formula);
          if (!best[exId] || e1rm > best[exId].e1rm) {
            best[exId] = { exId, type: 'e1rm', weight: wt, reps: rp, e1rm, date: w.date };
          }
        });
      });
    });
    return Object.values(best).sort((a,b) => {
      if (a.type !== b.type) return a.type === 'e1rm' ? -1 : 1;
      return b.type === 'reps' ? b.reps - a.reps : b.e1rm - a.e1rm;
    });
  }, [workouts, formula, exerciseDefs]);

  return (
    <div>
      {prs.length === 0 ? (
        <div className="empty-state"><div className="icon">🏆</div>記録を追加するとPRが表示されます</div>
      ) : prs.map(pr => (
        <div className="card" key={pr.exId} style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontWeight:700,fontSize:13}}>{allExercises[pr.exId] || pr.exId}</div>
            <div style={{fontSize:12,color:'var(--muted)'}}>
              {pr.type === 'reps' ? `${pr.reps}rep` : `${pr.weight}kg × ${pr.reps}rep`} — {pr.date}
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:18,fontWeight:900,color:'var(--gold)'}}>{pr.type === 'reps' ? pr.reps : pr.e1rm}</div>
            <div style={{fontSize:10,color:'var(--dim)'}}>{pr.type === 'reps' ? '最高回数' : 'e1RM'}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

// ==================== BODY WEIGHT PAGE ====================
function BodyWeightPage({ workouts, settings }) {
  const [weight, setWeight] = useState('');
  const [date, setDate] = useState(getToday());
  const [records, setRecords] = useState([]);
  const chartRef = useRef(null);
  const chartInstance = useRef(null);
  const glChartRef = useRef(null);
  const glChartInstance = useRef(null);
  const formula = settings.mainFormula || 'epley';

  async function load() { setRecords((await dbGetAll('bodyweight')).sort((a,b) => a.date.localeCompare(b.date))); }
  useEffect(() => { load(); }, []);

  async function save() {
    if (!weight) return;
    await dbPut('bodyweight', { date, weight: parseFloat(weight) });
    setWeight('');
    load();
  }

  // Get best bench e1RM for each date
  const benchE1RMByDate = useMemo(() => {
    const map = {};
    workouts.filter(w => w.exercises?.bench_heavy || w.exercises?.bench_mod).forEach(w => {
      ['bench_heavy','bench_mod'].forEach(exId => {
        (w.exercises?.[exId] || []).forEach(s => {
          if (s.weight && s.reps) {
            const e = calcE1RM(parseFloat(s.weight), parseInt(s.reps), formula);
            if (!map[w.date] || e > map[w.date]) map[w.date] = e;
          }
        });
      });
    });
    return map;
  }, [workouts, formula]);

  // Body weight chart
  useEffect(() => {
    if (!chartRef.current || records.length === 0) return;
    if (chartInstance.current) chartInstance.current.destroy();
    chartInstance.current = new Chart(chartRef.current, {
      type: 'line',
      data: {
        labels: records.map(r => r.date.slice(5)),
        datasets: [{ label: '体重 (kg)', data: records.map(r => r.weight),
          borderColor: '#3498db', backgroundColor: 'rgba(52,152,219,0.1)', fill: true, tension: 0.3, pointRadius: 3 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#a0a0b0', font: { size: 10 } }, grid: { color: '#2a2a4a' } },
          y: { ticks: { color: '#a0a0b0', font: { size: 10 } }, grid: { color: '#2a2a4a' } }
        }
      }
    });
    return () => { if (chartInstance.current) chartInstance.current.destroy(); };
  }, [records]);

  // GL Points chart
  useEffect(() => {
    if (!glChartRef.current || records.length === 0) return;
    if (glChartInstance.current) glChartInstance.current.destroy();

    // For each body weight record, find the nearest bench e1RM
    const glData = [];
    const glLabels = [];
    let lastE1RM = settings.actualMax?.bench || 185;

    records.forEach(r => {
      // Find closest bench e1rm
      const dates = Object.keys(benchE1RMByDate).sort();
      let closest = dates.reduce((prev, curr) =>
        Math.abs(new Date(curr) - new Date(r.date)) < Math.abs(new Date(prev) - new Date(r.date)) ? curr : prev
      , dates[0] || r.date);
      const e1rm = benchE1RMByDate[closest] || lastE1RM;
      lastE1RM = e1rm;
      const gl = calcGLPoints(e1rm, r.weight);
      glLabels.push(r.date.slice(5));
      glData.push(gl);
    });

    glChartInstance.current = new Chart(glChartRef.current, {
      type: 'line',
      data: {
        labels: glLabels,
        datasets: [{ label: 'GL Points', data: glData,
          borderColor: '#ffd700', backgroundColor: 'rgba(255,215,0,0.1)', fill: true, tension: 0.3, pointRadius: 3 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#a0a0b0', font: { size: 10 } }, grid: { color: '#2a2a4a' } },
          y: { ticks: { color: '#a0a0b0', font: { size: 10 } }, grid: { color: '#2a2a4a' } }
        }
      }
    });
    return () => { if (glChartInstance.current) glChartInstance.current.destroy(); };
  }, [records, workouts, formula, settings]);

  const latestWeight = records.length > 0 ? records[records.length - 1].weight : 67;
  const latestGL = calcGLPoints(settings.actualMax?.bench || 185, latestWeight);

  return (
    <div className="page">
      <div className="page-title">⚖️ 体重 & GL Points</div>

      <div className="card">
        <div style={{display:'flex',gap:8}}>
          <input type="date" value={date} onChange={e => setDate(e.target.value)} className="input-md" />
          <input className="input-md" style={{width:80}} placeholder="kg" type="number" inputMode="decimal"
            step="0.1" value={weight} onChange={e => setWeight(e.target.value)} />
          <button className="btn btn-accent btn-sm" onClick={save}>記録</button>
        </div>
      </div>

      <div className="card">
        <div style={{display:'flex',justifyContent:'space-around',textAlign:'center'}}>
          <div>
            <div style={{fontSize:11,color:'var(--muted)'}}>現在体重</div>
            <div style={{fontSize:24,fontWeight:900}}>{latestWeight}kg</div>
          </div>
          <div>
            <div style={{fontSize:11,color:'var(--muted)'}}>GL Points</div>
            <div style={{fontSize:24,fontWeight:900,color:'var(--gold)'}}>{latestGL.toFixed(1)}</div>
          </div>
          <div>
            <div style={{fontSize:11,color:'var(--muted)'}}>実測MAX</div>
            <div style={{fontSize:24,fontWeight:900,color:'var(--accent)'}}>{settings.actualMax?.bench || 185}kg</div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-title">体重推移</div>
        <div className="chart-container">
          <canvas ref={chartRef} />
        </div>
      </div>

      <div className="card">
        <div className="card-title">GL Points 推移</div>
        <div className="chart-container">
          <canvas ref={glChartRef} />
        </div>
        <div style={{fontSize:11,color:'var(--dim)',marginTop:4}}>
          100pt = エリート標準 / 体重が減ってもGLが維持or上昇 = 正しい減量
        </div>
      </div>

      {records.length > 0 && (
        <div className="card">
          <div className="card-title">直近の記録</div>
          {records.slice(-7).reverse().map(r => (
            <div key={r.date} className="stat-row">
              <span className="stat-label">{r.date}</span>
              <span style={{fontWeight:600}}>{r.weight} kg</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

      </div>

      <div style={{fontSize:11,color:'var(--dim)',marginBottom:8}}>
        {dayLabel(day)}日：{DAY_DESC[day]} ・ 今は W{currentN}
      </div>

      {Array.from({ length: PEAKING_WEEKS }, (_, i) => i + 1).map(n => {
        const e = peakingEntry(day, n, conds);
        if (!e) return (
          <div key={n} className={`pk-plan-item ${n < currentN ? 'done' : ''} ${n === currentN ? 'now' : ''}`}>
            <div className="pk-plan-head"><span className="pk-plan-name">{weekGuide(cfg, n)}</span><span style={{fontSize:10,color:'var(--dim)'}}>この週は{dayLabel(day)}日なし</span></div>
          </div>
        );
        return (
          <div key={n} className={`pk-plan-item ${n < currentN ? 'done' : ''} ${n === currentN ? 'now' : ''}`}>
            <div className="pk-plan-head">
              <span className="pk-plan-name">{weekGuide(cfg, n)}　{e.label}</span>
              <span className={`pk-phase ${e.key?'gold':''}`}>{e.phase}</span>
            </div>
            <div className="pk-plan-main">
              {e.main.map((m,i) => (
                <div key={i}>{m.tag}: {fmtKg(m.kg)}kg × {m.reps} × {m.sets}　<span style={{color:'var(--gold)'}}>{m.cap}</span></div>
              ))}
            </div>
            {e.acc && Object.keys(e.acc).length > 0 && (
              <div style={{fontSize:10,color:'var(--dim)',marginTop:5,lineHeight:1.6}}>
                補助: {Object.entries(e.acc).map(([id,v]) => `${exName(id)} ${v.sets}${v.hint?`(${v.hint})`:''}`).join(' / ')}
              </div>
            )}
            {e.acc && Object.keys(e.acc).length === 0 && (
              <div style={{fontSize:10,color:'var(--gold)',marginTop:5}}>補助なし</div>
            )}
            {e.note && <div style={{fontSize:10,color:'var(--dim)',marginTop:5,lineHeight:1.5}}>{e.note}</div>}
          </div>
        );
      })}

      <div className="card">
        <div className="card-title">試合形式プロトコル（A日）</div>
        <div style={{fontSize:12,lineHeight:1.7,color:'var(--muted)'}}>
          ① シングレット・リストラップ・<b style={{color:'var(--text)'}}>試合靴</b>を着用<br/>
          ② アップは毎回同じ：バー×10 → 60×5 → 100×3 → 130×2 → 145×1（各2〜3分）<br/>
          ③ 1本目の3分前に補助者へコール依頼（スタート／プレス／ラック）<br/>
          ④ 試技間は<b style={{color:'var(--text)'}}>10分</b>固定。次の重さを宣言してから座る<br/>
          ⑤ 3本すべてRPEを記録。3本目が判定指標<br/>
          ⑥ 母指球・小指球・踵の<b style={{color:'var(--text)'}}>3点で均等に踏む</b>。第1試技で足の位置を確定<br/>
          ⑦ <b style={{color:'var(--text)'}}>頭をベンチから離さない</b>（保険）。10/17の重ね合わせでは175と185のボトムはほぼ一致、差は押し始め〜10cmの区間<br/>
          ⑧ 足側から水平に横動画を撮る
        </div>
      </div>

      <div className="card">
        <div className="card-title">計画設定</div>
        <div className="stat-row">
          <span className="stat-label">計画開始日（W1の月曜）</span>
          <input type="date" className="input-md" style={{width:150}} value={cfg.start} onChange={e => setStart(e.target.value)} />
        </div>
        <div style={{fontSize:10,color:'var(--dim)',margin:'6px 0 10px',lineHeight:1.5}}>
          週番号は<b style={{color:'var(--muted)'}}>開始日からの暦週</b>で決まります（試合日が固定のため、欠席しても計画はずれません）。記録画面のプルダウンで手動指定も可能です。
        </div>
        <div className="stat-row" style={{marginBottom:6}}>
          <span className="stat-label">ピーキングモード</span>
          <span style={{fontWeight:700,color:cfg.mode?'var(--gold)':'var(--dim)'}}>{cfg.mode ? 'ON' : 'OFF'}</span>
        </div>
        <div style={{fontSize:10,color:'var(--dim)',marginBottom:8,lineHeight:1.5}}>
          ONの間は、記録画面のメニューがその週の計画に合わせて自動で切り替わります。OFFにすると通常の全種目メニューに戻ります。
        </div>
        <button className="btn btn-outline btn-block btn-sm" style={{marginBottom:6}} onClick={toggleMode}>
          {cfg.mode ? 'ピーキングモードを OFF にする' : 'ピーキングモードを ON にする'}
        </button>
        <button className="btn btn-outline btn-block btn-sm" onClick={toggleEnabled}>
          {cfg.enabled ? '計画パネルを非表示にする' : '計画パネルを表示する'}
        </button>
      </div>
    </div>
  );
}

// ==================== SETTINGS PAGE ====================
function SettingsPage({ settings, onUpdate }) {
  const [actualMax, setActualMax] = useState(settings.actualMax?.bench || 185);
  const [formula, setFormula] = useState(settings.mainFormula || 'epley');
  const [menuDay, setMenuDay] = useState('DAY1');
  const [menuCat, setMenuCat] = useState('CUSTOM');
  const [menuName, setMenuName] = useState('');
  const [menuTarget, setMenuTarget] = useState('8〜10rep x 3セット');
  const [menuSets, setMenuSets] = useState(3);
  const [menuIsBench, setMenuIsBench] = useState(false);
  const [menuIsBodyweight, setMenuIsBodyweight] = useState(false);
  const customExercises = getCustomExercises(settings);

  async function save() {
    const newSettings = { ...settings, key: 'main', mainFormula: formula, actualMax: { bench: parseFloat(actualMax) } };
    await dbPut('settings', newSettings);
    onUpdate(newSettings);
  }

  async function addCustomExercise() {
    if (!menuName.trim()) {
      alert('種目名を入力してください');
      return;
    }
    const ex = makeCustomExercise({
      dayType: menuDay,
      cat: menuCat,
      name: menuName,
      target: menuTarget,
      sets: menuSets,
      isBench: menuIsBench,
      isBodyweight: menuIsBodyweight
    });
    const newSettings = {
      ...settings,
      key: 'main',
      customExercises: [...customExercises, ex]
    };
    await dbPut('settings', newSettings);
    onUpdate(newSettings);
    setMenuName('');
    setMenuTarget('8〜10rep x 3セット');
    setMenuSets(3);
    setMenuIsBench(false);
    setMenuIsBodyweight(false);
  }

  async function removeCustomExercise(id) {
    if (!confirm('この追加種目をメニューから削除しますか？過去の記録データ自体は削除されません。')) return;
    const newSettings = {
      ...settings,
      key: 'main',
      customExercises: customExercises.filter(ex => ex.id !== id)
    };
    await dbPut('settings', newSettings);
    onUpdate(newSettings);
  }

  async function exportData() {
    const workouts = await dbGetAll('workouts');
    const bodyweight = await dbGetAll('bodyweight');
    const data = JSON.stringify({ workouts, bodyweight, settings }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `ironlog_backup_${getToday()}.json`;
    a.click(); URL.revokeObjectURL(url);
  }

  async function importData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    const data = JSON.parse(text);
    if (data.workouts) for (const w of data.workouts) await dbPut('workouts', w);
    if (data.bodyweight) for (const b of data.bodyweight) await dbPut('bodyweight', b);
    if (data.settings) { await dbPut('settings', {...data.settings, key:'main'}); onUpdate(data.settings); }
    alert('インポート完了！');
    location.reload();
  }

  async function clearVbtSamples() {
    if (!confirm('動画RPEの学習データをリセットしますか？')) return;
    const newSettings = { ...settings, key: 'main', vbtSamples: [] };
    await dbPut('settings', newSettings);
    onUpdate(newSettings);
  }

  async function clearAll() {
    if (!confirm('全データを削除しますか？この操作は取り消せません。')) return;
    const db = await openDB();
    const tx = db.transaction(['workouts','bodyweight','settings'], 'readwrite');
    tx.objectStore('workouts').clear();
    tx.objectStore('bodyweight').clear();
    tx.objectStore('settings').clear();
    tx.oncomplete = () => { alert('削除完了'); location.reload(); };
  }

  return (
    <div className="page">
      <div className="page-title">⚙️ 設定</div>

      <div className="card">
        <div className="card-title">メイン計算公式</div>
        <select value={formula} onChange={e => setFormula(e.target.value)} style={{width:'100%',marginBottom:8}}>
          {Object.entries(FORMULAS).map(([k,v]) => (
            <option key={k} value={k}>{v.name} — {v.desc}</option>
          ))}
        </select>
        <div style={{fontSize:11,color:'var(--dim)'}}>
          e1RM推移グラフやPR判定に使用されます。推奨: Epley（上級者）
        </div>
      </div>

      <div className="card">
        <div className="card-title">実測MAX（コールあり）</div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <span style={{color:'var(--muted)',fontSize:12}}>ベンチプレス</span>
          <input className="input-sm" type="number" value={actualMax} onChange={e => setActualMax(e.target.value)} />
          <span style={{color:'var(--muted)',fontSize:12}}>kg</span>
        </div>
        <div style={{fontSize:11,color:'var(--dim)',marginTop:4}}>
          推定1RMとの乖離を確認するための実測値。ベンチ系種目で1repを記録し、この値を超えた場合は自動更新されます。
        </div>
      </div>

      <button className="btn btn-accent btn-block" style={{marginBottom:12}} onClick={save}>保存</button>

      <div className="card">
        <div className="card-title">メニュー追加</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
          <select value={menuDay} onChange={e => setMenuDay(e.target.value)}>
            <option value="DAY1">A（試合形式）</option>
            <option value="DAY2">B（胸離れ）</option>
            <option value="DAY3">C（技術・底上げ）</option>
          </select>
          <select value={menuCat} onChange={e => setMenuCat(e.target.value)}>
            {CATEGORY_OPTIONS.map(cat => (
              <option key={cat} value={cat}>{cat}</option>
            ))}
          </select>
        </div>
        <input className="input-md" placeholder="種目名 例: ダンベルフライ" value={menuName}
          onChange={e => setMenuName(e.target.value)} style={{width:'100%',marginBottom:8}} />
        <input className="input-md" placeholder="目標 例: 10rep x 3セット" value={menuTarget}
          onChange={e => setMenuTarget(e.target.value)} style={{width:'100%',marginBottom:8}} />
        <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:8}}>
          <span style={{color:'var(--muted)',fontSize:12}}>セット数</span>
          <input className="input-sm" type="number" min="1" max="12" value={menuSets}
            onChange={e => setMenuSets(e.target.value)} />
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}}>
          <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--muted)',padding:'8px',background:'var(--input)',borderRadius:8}}>
            <input type="checkbox" checked={menuIsBench} onChange={e => {
              setMenuIsBench(e.target.checked);
              if (e.target.checked) setMenuIsBodyweight(false);
            }} />
            ベンチ系
          </label>
          <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--muted)',padding:'8px',background:'var(--input)',borderRadius:8}}>
            <input type="checkbox" checked={menuIsBodyweight} onChange={e => {
              setMenuIsBodyweight(e.target.checked);
              if (e.target.checked) setMenuIsBench(false);
            }} />
            自重系
          </label>
        </div>
        <div style={{fontSize:10,color:'var(--dim)',marginBottom:10}}>
          自重系は重量欄を表示せず、回数だけで前回比較・推奨回数・PRを判定します。
        </div>
        <button className="btn btn-accent btn-block" onClick={addCustomExercise}>＋ 種目を追加</button>

        {customExercises.length > 0 && (
          <>
            <div className="divider" />
            <div className="card-title">追加済みメニュー</div>
            {customExercises.map(ex => (
              <div key={ex.id} style={{display:'flex',justifyContent:'space-between',gap:8,alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
                <div>
                  <div style={{fontWeight:700,fontSize:13}}>{ex.name}</div>
                  <div style={{fontSize:11,color:'var(--muted)'}}>
                    {dayLabel(ex.dayType)} / {ex.cat} / {ex.sets}セット / {ex.target || '目標なし'}
                    {ex.isBench ? ' / ベンチ系' : ''}{ex.isBodyweight ? ' / 自重系' : ''}
                  </div>
                </div>
                <button className="btn btn-sm btn-outline" style={{color:'#e74c3c',flexShrink:0}} onClick={() => removeCustomExercise(ex.id)}>削除</button>
              </div>
            ))}
          </>
        )}
      </div>

      <div className="card">
        <div className="card-title">データ管理</div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          <button className="btn btn-outline btn-block" onClick={exportData}>📤 データをエクスポート (JSON)</button>
          <label className="btn btn-outline btn-block" style={{textAlign:'center',cursor:'pointer'}}>
            📥 データをインポート
            <input type="file" accept=".json" onChange={importData} style={{display:'none'}} />
          </label>
          <div className="divider" />
          <button className="btn btn-outline btn-block" style={{color:'#e74c3c'}} onClick={clearAll}>
            🗑 全データを削除
          </button>
        </div>
      </div>

      <div className="card">
        <div className="card-title">動画RPE 学習データ</div>
        <div style={{fontSize:12,color:'var(--muted)',marginBottom:8}}>
          蓄積サンプル: {Array.isArray(settings.vbtSamples) ? settings.vbtSamples.length : 0}件
          {(settings.vbtSamples?.length || 0) >= 5 ? '（個人補正モードで動作中）' : '（5件から個人補正が有効になります）'}
        </div>
        <button className="btn btn-sm btn-outline" style={{color:'#e74c3c'}} onClick={clearVbtSamples}>学習データをリセット</button>
      </div>

      <div className="card">
        <div className="card-title">GL Points 計算式</div>
        <div style={{fontSize:11,color:'var(--dim)',lineHeight:1.6}}>
          IPF GL Points = Result × 100 / (A − B × e^(−C × BW))<br/>
          Classic Bench Press (Men):<br/>
          A=320.98041, B=281.40258, C=0.01008<br/>
          100pt = エリートアスリート標準
        </div>
      </div>

      <div style={{textAlign:'center',color:'var(--dim)',fontSize:11,padding:'20px 0'}}>
        IRON LOG v1.8 — Video RPE (縦ガイド校正)
      </div>
    </div>
  );
}

// ==================== MAIN APP ====================
function App() {
  const [page, setPage] = useState('workout');
  const [workouts, setWorkouts] = useState([]);
  const [settings, setSettings] = useState({ mainFormula: 'epley', actualMax: { bench: 185 }, customExercises: [] });

  async function loadAll() {
    const w = await dbGetAll('workouts');
    setWorkouts(w);
    const bw = await dbGetAll('bodyweight');
    const latest = (bw || []).slice().sort((a,b) => String(a.date).localeCompare(String(b.date))).pop();
    if (latest) setLatestBw(latest.weight);
    const s = await dbGet('settings', 'main');
    if (s) setSettings(s);
  }

  useEffect(() => { openDB().then(loadAll); }, []);

  const nav = [
    { id: 'workout', icon: '🏋️', label: '記録' },
    { id: 'plan', icon: '🎯', label: '計画' },
    { id: 'calendar', icon: '📅', label: 'カレンダー' },
    { id: 'e1rm', icon: '📊', label: '1RM' },
    { id: 'weight', icon: '⚖️', label: '体重' },
    { id: 'settings', icon: '⚙️', label: '設定' },
  ];

  return (
    <div className="app">
      {page === 'workout' && <WorkoutPage settings={settings} onSave={loadAll} allWorkouts={workouts} />}
      {page === 'plan' && <PlanPage workouts={workouts} settings={settings} onUpdate={s => { setSettings(s); loadAll(); }} />}
      {page === 'calendar' && <CalendarPage workouts={workouts} settings={settings} />}
      {page === 'e1rm' && <E1RMPage workouts={workouts} settings={settings} />}
      {page === 'weight' && <BodyWeightPage workouts={workouts} settings={settings} />}
      {page === 'settings' && <SettingsPage settings={settings} onUpdate={s => { setSettings(s); loadAll(); }} />}

      <nav className="nav">
        {nav.map(n => (
          <button key={n.id} className={`nav-btn ${page===n.id?'active':''}`} onClick={() => setPage(n.id)}>
            <span className="icon">{n.icon}</span>
            {n.label}
          </button>
        ))}
      </nav>
    </div>
  );
}

// Register Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(e => console.log('SW registration failed:', e));
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
